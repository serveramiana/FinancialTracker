/* ---------------------------------------------------------- SPENDING */
let SPD_CAT="";
PAGES.spending=()=>{
  const p=resolvePeriod(), list=periodTx(p), t=totalByPillar(list), b=budgetFor(p);
  const y=p.y||CUR_Y, rows=monthlySeries(y), el=periodElapsed(p);
  if(!S.transactions.some(x=>x.pillar==="Spending"))
    return `<div class="page">${pageHead("Spending Intelligence","Day-to-day consumption.")}
      ${pillarEmpty("Spending","Spending is money that is gone \u2014 the ordinary running cost of your life.",
        ["Food, rent, utilities, transport, subscriptions","Tag each one Need or Want to see the split",
         "Large one-off purchases belong in Expenditure instead"])}</div>`;
  const dn=chartId(), tr=chartId(), nw=chartId(), bv=chartId();
  const cats=byCategory(list,"Spending");
  const needs=sum(list.filter(x=>x.pillar==="Spending"&&x.needWant==="Need").map(x=>+x.amount||0));
  const wants=sum(list.filter(x=>x.pillar==="Spending"&&x.needWant==="Want").map(x=>+x.amount||0));
  const untag=t.Spending-needs-wants;
  onMount(()=>{
    const sh=["#AE382F","#BF5147","#CD6A60","#D9827A","#E39B94","#EBB3AD","#F1CBC7","#C58F89"];
    donutChart($("#"+dn),{slices:cats.slice(0,8).map((c,i)=>({name:c.name,value:c.value,color:sh[i%sh.length]})),
      centerSub:"Spending"});
    lineChart($("#"+tr),{labels:rows.map(r=>r.label),series:[
      {name:"Spending",values:line(rows,"Spending"),color:HUE.Spending,area:true},
      {name:"Budget",values:MONTHS.map((_,m)=>+((S.budgets[mKey(y,m)]||{}).Spending)||null),color:"var(--line-2)"}]});
    donutChart($("#"+nw),{size:170,slices:[
      {name:"Needs",value:needs,color:"var(--spending)"},
      {name:"Wants",value:wants,color:"#E39B94"},
      {name:"Untagged",value:Math.max(0,untag),color:"var(--line-2)"}],centerSub:"Spending"});
    barChart($("#"+bv),{labels:MON,series:[
      {name:"Budget",values:MONTHS.map((_,m)=>+((S.budgets[mKey(y,m)]||{}).Spending)||0),color:"var(--line-2)"},
      {name:"Actual",values:rows.map(r=>r.Spending),color:HUE.Spending}]});
  });
  const days=el.past?el.total:Math.max(1,el.day);
  const drill=SPD_CAT?list.filter(x=>x.pillar==="Spending"&&x.category===SPD_CAT):[];
  return `<div class="page">
    ${pageHead("Spending Intelligence",`Consumption during ${p.label}.`)}
    <div class="kpi-grid" style="margin-bottom:14px">
      ${kpi({pillar:"Spending",label:"Spent this period",value:t.Spending,
        rows:[b.Spending?{k:"Budget",v:`${moneyPlain(b.Spending,0)} \u00B7 ${pct(t.Spending/b.Spending,0)}`}
          :{k:"Budget",v:'<span style="color:var(--text-3)">Not set</span>'},trendRow("Spending")]})}
      ${kpi({pillar:"Spending",label:b.Spending&&b.Spending>=t.Spending?"Budget remaining":"Over budget",
        value:b.Spending?Math.abs(b.Spending-t.Spending):null,
        rows:[{k:"Status",v:badge(budgetStatus("Spending",t.Spending,b.Spending).tone,
          budgetStatus("Spending",t.Spending,b.Spending).label)},
          {k:"Month elapsed",v:pct(el.frac,0)}]})}
      ${kpi({pillar:"Spending",label:"Average per day",value:t.Spending/days,
        rows:[{k:"Per week",v:moneyPlain(t.Spending/days*7,0)},{k:"Days counted",v:days}]})}
      ${kpi({pillar:"Spending",label:"Largest category",value:cats[0]?cats[0].value:null,
        rows:[{k:"Category",v:esc(cats[0]?cats[0].name:"\u2014")},
              {k:"Share of spending",v:cats[0]?pct(cats[0].value/t.Spending,0):"\u2014"}]})}
    </div>
    <div class="split" style="margin-bottom:14px">
      ${card("Spending by category",`<div id="${dn}"></div>`,{note:"Top eight"})}
      ${card("Needs against wants",`<div id="${nw}"></div>${untag>0?
        `<p class="card-note" style="margin-top:8px">${moneyPlain(untag,0)} is untagged.
         Set Need or Want on a transaction to sharpen this.</p>`:""}`)}
    </div>
    <div class="split-even" style="margin-bottom:14px">
      ${card(`Spending through ${y}`,`<div id="${tr}"></div>`)}
      ${card(`Budget against actual, ${y}`,`<div id="${bv}"></div>`)}
    </div>
    ${card("Category breakdown",`
      <p class="card-note" style="margin:-4px 0 10px">Select a category to see the transactions behind it.</p>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Category</th><th class="r">Amount</th><th class="r">Share</th>
          <th class="r">Records</th><th class="r" style="width:130px">Weight</th><th></th></tr></thead>
        <tbody>${cats.map(c=>{
          const n=list.filter(x=>x.pillar==="Spending"&&x.category===c.name).length;
          return `<tr${SPD_CAT===c.name?' style="background:var(--spending-s)"':''}>
            <td><span class="swatch" style="background:${HUE.Spending}"></span>${esc(c.name)}</td>
            <td class="r strong">${moneyPlain(c.value,0)}</td>
            <td class="r">${pct(c.value/t.Spending,1)}</td>
            <td class="r" style="color:var(--text-2)">${n}</td>
            <td class="r">${meter(c.value/cats[0].value,HUE.Spending,true)}</td>
            <td style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="drill"
              data-cat="${esc(c.name)}">${SPD_CAT===c.name?"Hide":"View"}</button></td></tr>`;
        }).join("")}
        <tr class="total"><td>Total</td><td class="r">${moneyPlain(t.Spending,0)}</td>
          <td class="r">100%</td><td colspan="3"></td></tr></tbody></table></div>
      ${SPD_CAT?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
        <div class="card-title" style="margin-bottom:8px">${esc(SPD_CAT)} \u00B7 ${drill.length} record${drill.length===1?"":"s"}</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Description</th>
          <th>Need / Want</th><th>Method</th><th class="r">Amount</th></tr></thead>
          <tbody>${drill.sort((a,b2)=>b2.date.localeCompare(a.date)).map(x=>`<tr>
            <td style="white-space:nowrap">${fmtDate(x.date)}</td><td>${esc(x.description||"\u2014")}</td>
            <td style="color:var(--text-2)">${esc(x.needWant||"\u2014")}</td>
            <td style="color:var(--text-2)">${esc(x.method||"\u2014")}</td>
            <td class="r strong">${moneyPlain(+x.amount||0,2)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    `)}
  </div>`;
};

/* ---------------------------------------------------------- EXPENDITURE */
PAGES.expenditure=()=>{
  const p=resolvePeriod(), list=periodTx(p), t=totalByPillar(list), b=budgetFor(p);
  const y=p.y||CUR_Y, rows=monthlySeries(y);
  const all=S.transactions.filter(x=>x.pillar==="Expenditure");
  if(!all.length)
    return `<div class="page">${pageHead("Major Expenditures","Big, planned, occasional outflows.")}
      ${pillarEmpty("Expenditure","Expenditure is separated from everyday spending so one large purchase does not make an ordinary month look like a disaster.",
        ["Appliances, electronics, furniture, vehicles","Tuition, medical procedures, travel",
         "Track each one from Planned through to Paid"])}</div>`;
  const items=list.filter(x=>x.pillar==="Expenditure");
  const byStatus=Object.fromEntries(STATUSES.map(s=>[s,sum(items.filter(x=>x.status===s).map(x=>+x.amount||0))]));
  const committed=byStatus["Planned"]+byStatus["Upcoming"]+byStatus["Partially Paid"];
  const bv=chartId();
  onMount(()=>barChart($("#"+bv),{labels:MON,series:[
    {name:"Plan",values:MONTHS.map((_,m)=>+((S.budgets[mKey(y,m)]||{}).Expenditure)||0),color:"var(--line-2)"},
    {name:"Actual",values:rows.map(r=>r.Expenditure),color:HUE.Expenditure}]}));
  const upcoming=S.transactions.filter(x=>x.pillar==="Expenditure"&&
    (x.status==="Planned"||x.status==="Upcoming")).sort((a,b2)=>a.date.localeCompare(b2.date));
  return `<div class="page">
    ${pageHead("Major Expenditures",`Planned and one-off outflows in ${p.label}.`)}
    <div class="kpi-grid" style="margin-bottom:14px">
      ${kpi({pillar:"Expenditure",label:"Expenditure this period",value:t.Expenditure,
        rows:[goalRow("Expenditure",b,t),trendRow("Expenditure")]})}
      ${kpi({pillar:"Expenditure",label:"Settled",value:byStatus["Paid"],
        rows:[{k:"Partially paid",v:moneyPlain(byStatus["Partially Paid"],0)},
              {k:"Records",v:items.filter(x=>x.status==="Paid").length}]})}
      ${kpi({pillar:"Expenditure",label:"Committed, not yet paid",value:committed,
        rows:[{k:"Planned",v:moneyPlain(byStatus["Planned"],0)},
              {k:"Upcoming",v:moneyPlain(byStatus["Upcoming"],0)}]})}
      ${kpi({pillar:"Expenditure",label:"Against plan",value:b.Expenditure?b.Expenditure-t.Expenditure:null,
        rows:[{k:"Plan",v:b.Expenditure?moneyPlain(b.Expenditure,0):"Not set"},
              {k:"Status",v:badge(budgetStatus("Expenditure",t.Expenditure,b.Expenditure).tone,
                budgetStatus("Expenditure",t.Expenditure,b.Expenditure).label)}]})}
    </div>
    <div class="split" style="margin-bottom:14px">
      ${card(`Plan against actual, ${y}`,`<div id="${bv}"></div>`)}
      ${card("Status pipeline",`
        ${STATUSES.map(s=>{
          const v=byStatus[s]||0, n=items.filter(x=>x.status===s).length;
          return `<div style="margin:10px 0">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
              <span>${s} <span style="color:var(--text-3)">\u00B7 ${n}</span></span>
              <span style="font-variant-numeric:tabular-nums;color:var(--text-2)">${moneyPlain(v,0)}</span></div>
            ${meter(ratio(v,t.Expenditure)||0,HUE.Expenditure,true)}</div>`;
        }).join("")}
        <p class="card-note" style="margin-top:10px">Cancelled items are excluded from every total in the app.</p>`)}
    </div>
    ${card("Coming up",upcoming.length?`<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Status</th><th class="r">Amount</th><th></th></tr></thead>
      <tbody>${upcoming.map(x=>`<tr><td style="white-space:nowrap">${fmtDate(x.date)}</td>
        <td>${esc(x.category||"\u2014")}</td><td>${esc(x.description||"\u2014")}</td>
        <td>${badge(x.status==="Upcoming"?"warn":"info",x.status)}</td>
        <td class="r strong">${moneyPlain(+x.amount||0,0)}</td>
        <td style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="edit-tx" data-id="${x.id}">Edit</button></td>
      </tr>`).join("")}</tbody></table></div>`
      :`<div class="empty-sm">Nothing planned or upcoming.</div>`,{note:"Across all periods, not just this one"})}
    <div style="height:14px"></div>
    ${card("Expenditure by category",catTable(list,"Expenditure",t.Expenditure))}
  </div>`;
};

/* ---------------------------------------------------------- INVESTMENTS */
PAGES.investments=()=>{
  const p=resolvePeriod(), list=periodTx(p), t=totalByPillar(list), b=budgetFor(p);
  const y=p.y||CUR_Y, rows=monthlySeries(y);
  const allInv=S.transactions.filter(x=>x.pillar==="Investment");
  const contributed=sum(allInv.map(x=>+x.amount||0));
  const valued=S.holdings.filter(h=>h.value!==""&&h.value!==null&&h.value!==undefined&&isFinite(+h.value));
  const totalValue=sum(valued.map(h=>+h.value||0));
  const investedInValued=sum(valued.map(h=>+h.invested||0));
  const canReturn=valued.length>0&&investedInValued>0;

  if(!allInv.length&&!S.holdings.length)
    return `<div class="page">${pageHead("Investment & Wealth","Money working to grow.")}
      ${pillarEmpty("Investment","Record contributions as they happen. Portfolio value is entered by you \u2014 the app will never invent a return.",
        ["Stocks, index funds, UITF, mutual funds, Pag-IBIG MP2","Business capital and real estate",
         "Add holdings below to track value against what you put in"])}</div>`;
  const bc=chartId(), dn=chartId();
  onMount(()=>{
    barChart($("#"+bc),{labels:MON,series:[
      {name:"Target",values:MONTHS.map((_,m)=>+((S.budgets[mKey(y,m)]||{}).Investment)||0),color:"var(--line-2)"},
      {name:"Contributed",values:rows.map(r=>r.Investment),color:HUE.Investment}]});
    const alloc=byField(allInv,"category");
    const sh=["#2A578F","#3D6BA3","#5280B6","#6A95C7","#85AAD6","#A2C0E2","#C0D5ED","#93B2D3"];
    donutChart($("#"+dn),{slices:alloc.map((a,i)=>({name:a.name,value:a.value,color:sh[i%sh.length]})),
      centerSub:"Contributed"});
  });
  return `<div class="page">
    ${pageHead("Investment & Wealth",`Contributions in ${p.label}, and holdings you track.`)}
    <div class="kpi-grid" style="margin-bottom:14px">
      ${kpi({pillar:"Investment",label:"Invested this period",value:t.Investment,
        rows:[goalRow("Investment",b,t),trendRow("Investment")]})}
      ${kpi({pillar:"Investment",label:"Total contributed",value:contributed,
        rows:[{k:"Across",v:`${allInv.length} record${allInv.length===1?"":"s"}`},
              {k:`In ${y}`,v:moneyPlain(sum(rows.map(r=>r.Investment)),0)}]})}
      ${kpi({pillar:"Investment",label:"Portfolio value",value:valued.length?totalValue:null,
        rows:valued.length?[{k:"Holdings valued",v:`${valued.length} of ${S.holdings.length}`}]
          :[{k:"Status",v:'<span style="color:var(--text-3)">Enter values below</span>'}]})}
      ${kpi({pillar:"Investment",label:"Gain or loss",value:canReturn?totalValue-investedInValued:null,
        rows:canReturn?[{k:"Return on valued holdings",
          v:`<span style="color:${totalValue>=investedInValued?"var(--ok)":"var(--bad)"}">
             ${pct((totalValue-investedInValued)/investedInValued,1)}</span>`},
          {k:"Cost of those holdings",v:moneyPlain(investedInValued,0)}]
          :[{k:"Status",v:'<span style="color:var(--text-3)">Not calculated</span>'}]})}
    </div>
    <div class="notice verify" style="margin-bottom:14px"><span class="tagv">VERIFY</span>
      Portfolio value, gain and return are shown only for holdings where <b>you</b> have entered a current
      market value. Nothing is estimated, projected or fetched from a market feed.
      ${canReturn?"Return is a simple change against cost \u2014 it is not annualised and excludes fees, taxes and dividends taken as cash.":""}
    </div>
    <div class="split" style="margin-bottom:14px">
      ${card(`Contributions through ${y}`,`<div id="${bc}"></div>`)}
      ${card("Contributions by type",`<div id="${dn}"></div>`)}
    </div>
    ${card("Holdings",S.holdings.length?`<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Holding</th><th>Type</th><th class="r">Cost</th><th class="r">Current value</th>
        <th class="r">Gain / loss</th><th class="r">Return</th><th></th></tr></thead>
      <tbody>${S.holdings.map(h=>{
        const inv=+h.invested||0, val=(h.value===""||h.value===null||h.value===undefined)?null:+h.value;
        const gl=val===null?null:val-inv;
        return `<tr><td class="strong">${esc(h.name||"Unnamed")}</td>
          <td style="color:var(--text-2)">${esc(h.class||"\u2014")}</td>
          <td class="r">${moneyPlain(inv,0)}</td>
          <td class="r"><input type="number" step="0.01" class="hcell" data-hold="${h.id}"
            value="${val===null?"":val}" placeholder="Not entered" aria-label="Current value of ${esc(h.name)}"
            style="width:130px;text-align:right;padding:5px 8px;border:1px solid var(--line-2);
            border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums"></td>
          <td class="r" style="color:${gl===null?"inherit":gl>=0?"var(--ok)":"var(--bad)"}">
            ${gl===null?`<span class="tagv">VERIFY</span>`:moneyPlain(gl,0)}</td>
          <td class="r">${gl===null||!inv?"\u2014":pct(gl/inv,1)}</td>
          <td style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="del-hold"
            data-id="${h.id}" aria-label="Remove holding">\u00D7</button></td></tr>`;
      }).join("")}
      <tr class="total"><td colspan="2">Total
        ${valued.length&&valued.length<S.holdings.length?`<div style="font-weight:400;font-size:11px;
          color:var(--text-3)">Value, gain and return cover only the ${valued.length} valued holding${valued.length===1?"":"s"}</div>`:""}</td>
        <td class="r">${moneyPlain(sum(S.holdings.map(h=>+h.invested||0)),0)}
          ${valued.length&&valued.length<S.holdings.length?`<div style="font-weight:400;font-size:11px;
            color:var(--text-3)">${moneyPlain(investedInValued,0)} valued</div>`:""}</td>
        <td class="r">${valued.length?moneyPlain(totalValue,0):"\u2014"}</td>
        <td class="r">${canReturn?moneyPlain(totalValue-investedInValued,0):"\u2014"}</td>
        <td class="r">${canReturn?pct((totalValue-investedInValued)/investedInValued,1):"\u2014"}</td><td></td></tr>
      </tbody></table></div>`:`<div class="empty-sm">No holdings tracked yet.</div>`,
      {right:`<button class="btn btn-sm" data-act="add-hold">Add holding</button>`,
       note:"Cost is what you put in; value is what you enter"})}
    <div style="height:14px"></div>
    ${card("Investment by type",catTable(list,"Investment",t.Investment))}
  </div>`;
};

/* ---------------------------------------------------------- PROTECTION */
PAGES.protection=()=>{
  const p=resolvePeriod(), list=periodTx(p), t=totalByPillar(list), b=budgetFor(p);
  const y=p.y||CUR_Y;
  const allPro=S.transactions.filter(x=>x.pillar==="Protection");
  if(!allPro.length&&!Object.keys(S.protectionTargets).length)
    return `<div class="page">${pageHead("Financial Protection","What keeps a bad month from becoming a crisis.")}
      ${pillarEmpty("Protection","Protection is about resilience rather than growth. Set your own targets \u2014 the app will not invent recommended coverage amounts.",
        ["Emergency fund and emergency cash","Health, life, property and vehicle cover",
         "SSS, PhilHealth and Pag-IBIG contributions"])}</div>`;
  const ytd=txInRange(new Date(y,0,1),new Date(y,11,31));
  const efSaved=sum(ytd.filter(x=>/emergency/i.test(x.category||"")&&
    (x.pillar==="Savings"||x.pillar==="Protection")).map(x=>+x.amount||0));
  const burn=ratio(sum(ytd.filter(x=>FLOW[x.pillar]==="expense").map(x=>+x.amount||0)),
    Math.max(1,new Date().getMonth()+1));
  const cover=burn?efSaved/burn:null;
  const target=S.settings.emergencyMonths;
  const cats=[...new Set([...Object.keys(S.protectionTargets),
    ...ytd.filter(x=>x.pillar==="Protection").map(x=>x.category)])].filter(Boolean).sort();
  const funded=cats.map(c=>{
    const got=sum(ytd.filter(x=>x.pillar==="Protection"&&x.category===c).map(x=>+x.amount||0));
    const tgt=+S.protectionTargets[c]||0;
    return {c,got,tgt,prog:tgt?clamp(got/tgt,0,1):null};
  });
  const scored=funded.filter(f=>f.prog!==null);
  const score=scored.length?sum(scored.map(f=>f.prog))/scored.length:null;
  return `<div class="page">
    ${pageHead("Financial Protection","Resilience, not growth.")}
    <div class="kpi-grid" style="margin-bottom:14px">
      ${kpi({pillar:"Protection",label:"Protection this period",value:t.Protection,
        rows:[goalRow("Protection",b,t),trendRow("Protection")]})}
      ${kpi({pillar:"Protection",label:`Emergency reserve, ${y}`,value:efSaved,
        rows:[{k:"Average monthly outgoings",v:burn?moneyPlain(burn,0):"\u2014"},
              {k:"Months of cover",v:cover!==null?cover.toFixed(1):"\u2014"}]})}
      ${kpi({pillar:"Protection",label:"Cover against target",value:null,
        rows:[{k:"Your target",v:`${target} months`},
              {k:"Progress",v:cover!==null?pct(clamp(cover/target,0,1),0):"\u2014"}]})}
      ${kpi({pillar:"Protection",label:"Protection score",value:null,
        rows:[{k:"Items funded",v:score!==null?pct(score,0):"Set targets below"},
              {k:"Items with a target",v:`${scored.length} of ${funded.length}`}]})}
    </div>
    ${cover!==null?card("Safety net",`
      <div class="pace" style="margin-bottom:10px">
        <span class="pace-flag" style="left:${clamp(1/Math.max(target,1),0.06,0.94)*100}%">1 month</span>
        ${meter(clamp(cover/target,0,1),HUE.Protection)}</div>
      <div class="stat-row"><span>Emergency reserve recorded</span><b>${moneyPlain(efSaved,0)}</b></div>
      <div class="stat-row"><span>Average monthly outgoings this year</span><b>${moneyPlain(burn,0)}</b></div>
      <div class="stat-row"><span>Months of cover</span><b>${cover.toFixed(1)} of ${target}</b></div>
      <p class="card-note" style="margin-top:10px"><span class="tagv">VERIFY</span>
        Counts only emergency-fund amounts you recorded here, measured against your own average spending.
        It is not a recommendation about how much cover you need.</p>`,
      {note:"How long recorded reserves would cover your outgoings"}):""}
    <div style="height:14px"></div>
    ${card("Coverage tracker",`
      <p class="card-note" style="margin:-4px 0 10px">Set your own target for each item. Funded is what you
        recorded in ${y}.</p>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Protection item</th><th class="r">Your target</th><th class="r">Funded ${y}</th>
          <th class="r">Gap</th><th class="r" style="width:150px">Progress</th></tr></thead>
        <tbody>${funded.length?funded.map(f=>`<tr>
          <td><span class="swatch" style="background:${HUE.Protection}"></span>${esc(f.c)}</td>
          <td class="r"><input type="number" min="0" step="100" class="pcell" data-prot="${esc(f.c)}"
            value="${f.tgt||""}" placeholder="0" aria-label="Target for ${esc(f.c)}"
            style="width:118px;text-align:right;padding:5px 8px;border:1px solid var(--line-2);
            border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums"></td>
          <td class="r strong">${moneyPlain(f.got,0)}</td>
          <td class="r">${f.tgt?moneyPlain(Math.max(0,f.tgt-f.got),0):"\u2014"}</td>
          <td class="r">${f.prog===null?'<span style="color:var(--text-3)">No target</span>'
            :`${meter(f.prog,HUE.Protection,true)}<span style="font-size:11px;color:var(--text-3)">${pct(f.prog,0)}</span>`}</td>
        </tr>`).join(""):`<tr><td colspan="5" class="empty-sm">Nothing recorded yet.</td></tr>`}</tbody></table></div>
      <div class="inline-add" style="margin-top:12px;max-width:420px">
        <input id="newProt" placeholder="Add a protection item to track" aria-label="New protection item">
        <button class="btn btn-sm" data-act="add-prot">Add</button></div>`)}
    <div style="height:14px"></div>
    ${card("Protection by item, this period",catTable(list,"Protection",t.Protection))}
  </div>`;
};

/* ---------------------------------------------------------- GOALS */
function goalGrid(filter){
  const gs=S.goals.filter(filter||(()=>true));
  if(!gs.length) return `<div class="empty-sm">No goals yet.
    <button class="att-link" data-act="add-goal">Add one \u2192</button></div>`;
  return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">
    ${gs.map(g=>{
      const {progress,remaining,status}=goalProgress(g);
      return `<div class="goal-card">
        <div class="goal-top">
          <div style="flex:1;min-width:0">
            <div class="goal-name">${esc(g.name)}</div>
            <div class="goal-meta">${g.deadline?`by ${fmtDate(g.deadline)}`:"No deadline"}
              ${g.monthly?` \u00B7 ${moneyPlain(+g.monthly,0)}/month`:""}</div>
          </div>${badge(status.tone,status.label)}</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span class="amt" style="font-size:17px">${moneyPlain(+g.current||0,0)}</span>
          <span style="font-size:12px;color:var(--text-2)">of ${moneyPlain(+g.target||0,0)}</span></div>
        ${meter(progress,"var(--brass)")}
        <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--text-2)">
          <span>${progress===null?"\u2014":pct(progress,0)} funded</span>
          <span>${moneyPlain(remaining,0)} to go</span></div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <button class="btn btn-sm" data-act="edit-goal" data-id="${g.id}">Edit</button>
          <button class="btn btn-sm btn-ghost" data-act="del-goal" data-id="${g.id}">Remove</button></div>
      </div>`;
    }).join("")}</div>`;
}
PAGES.goals=()=>{
  const done=S.goals.filter(g=>goalProgress(g).status.key==="done").length;
  return `<div class="page">
    ${pageHead("Financial Goals","What you are actually saving towards.")}
    ${S.goals.length?`<div class="kpi-grid" style="margin-bottom:14px">
      ${kpi({label:"Goals tracked",value:S.goals.length,hue:"var(--brass)",
        rows:[{k:"Completed",v:done},{k:"In progress",v:S.goals.length-done}]})}
      ${kpi({label:"Total targeted",value:sum(S.goals.map(g=>+g.target||0)),hue:"var(--brass)",
        rows:[{k:"Funded so far",v:moneyPlain(sum(S.goals.map(g=>+g.current||0)),0)}]})}
      ${kpi({label:"Still to fund",value:sum(S.goals.map(g=>goalProgress(g).remaining)),hue:"var(--brass)",
        rows:[{k:"Committed monthly",v:moneyPlain(sum(S.goals.map(g=>+g.monthly||0)),0)}]})}
      ${kpi({label:"Overall progress",value:null,hue:"var(--brass)",
        rows:[{k:"Funded",v:pct(ratio(sum(S.goals.map(g=>+g.current||0)),sum(S.goals.map(g=>+g.target||0)))||0,0)}]})}
    </div>`:""}
    ${card("Your goals",S.goals.length?goalGrid():emptyState({
      glyph:"\u25CE",title:"No goals set",
      body:"A goal turns a vague intention into a number with a date. Progress is whatever you enter \u2014 it is not deducted from your transactions automatically.",
      action:`<button class="btn btn-primary" data-act="add-goal">Add a goal</button>`}),
      {right:S.goals.length?`<button class="btn btn-sm btn-primary" data-act="add-goal">Add goal</button>`:""})}
  </div>`;
};

/* ---------------------------------------------------------- REPORTS */
PAGES.reports=()=>{
  const p=resolvePeriod(), y=p.y||CUR_Y, rows=monthlySeries(y);
  if(!S.transactions.length)
    return `<div class="page">${pageHead("Financial Reports","The long view.")}
      ${card("",emptyState({glyph:"\u2261",title:"Nothing to report yet",
        body:"Reports compare periods against each other. Record a few transactions and this fills in.",
        action:addBtn()}))}</div>`;
  const ytdList=txInRange(new Date(y,0,1),new Date(y,CUR_M+1,0));
  const yt=totalByPillar(ytdList);
  const wl=chartId(), nf=chartId();
  onMount(()=>{
    lineChart($("#"+wl),{labels:rows.map(r=>r.label),series:[
      {name:"Savings",values:line(rows,"Savings"),color:HUE.Savings},
      {name:"Investment",values:line(rows,"Investment"),color:HUE.Investment},
      {name:"Protection",values:line(rows,"Protection"),color:HUE.Protection}]});
    barChart($("#"+nf),{labels:MON,series:[{name:"Net cash flow",values:rows.map(r=>r.net),
      colors:rows.map(r=>r.net>=0?"var(--income)":"var(--spending)"),color:HUE.Income}]});
  });
  const assets=sum(S.assets.map(a=>+a.value||0)), liabs=sum(S.liabilities.map(a=>+a.value||0));
  const hasNW=S.assets.length||S.liabilities.length;
  return `<div class="page">
    ${pageHead("Financial Reports",`${p.label}. Switch the period in the header to change everything below.`)}
    <div class="kpi-grid" style="margin-bottom:14px">
      ${kpi({pillar:"Income",label:`Income, year to date`,value:yt.Income,rows:[{k:y,v:"Jan to "+MON[CUR_M]}]})}
      ${kpi({pillar:"Spending",label:"True expenses, YTD",value:yt.Spending+yt.Expenditure,
        rows:[{k:"Spending",v:moneyPlain(yt.Spending,0)},{k:"Expenditure",v:moneyPlain(yt.Expenditure,0)}]})}
      ${kpi({label:"Net cash flow, YTD",value:yt.Income-yt.Spending-yt.Expenditure,hue:"var(--brass)",
        rows:[{k:"Savings rate",v:pct(ratio(yt.Savings,yt.Income)||0,1)}]})}
      ${kpi({pillar:"Savings",label:"Moved to your goals, YTD",value:yt.Savings+yt.Investment+yt.Protection,
        rows:[{k:"Savings",v:moneyPlain(yt.Savings,0)},
              {k:"Investing / protection",v:moneyPlain(yt.Investment+yt.Protection,0)}]})}
    </div>
    ${card(`Month by month, ${y}`,`<div class="tbl-wrap"><table class="tbl" style="min-width:1000px">
      <thead><tr><th>Line</th>${MON.map(l=>`<th class="r">${l}</th>`).join("")}<th class="r">Year</th></tr></thead>
      <tbody>
        ${PILLARS.map(pl=>`<tr><td><span class="swatch" style="background:${HUE[pl]}"></span>${pl}</td>
          ${rows.map(r=>`<td class="r">${r[pl]?Math.round(r[pl]).toLocaleString("en-PH"):'<span style="color:var(--text-3)">\u2014</span>'}</td>`).join("")}
          <td class="r strong">${Math.round(sum(rows.map(r=>r[pl]))).toLocaleString("en-PH")}</td></tr>`).join("")}
        <tr class="total"><td>Net cash flow</td>
          ${rows.map(r=>`<td class="r" style="color:${r.net<0?"var(--bad)":r.net>0?"var(--ok)":"inherit"}">
            ${r.count?Math.round(r.net).toLocaleString("en-PH"):"\u2014"}</td>`).join("")}
          <td class="r">${Math.round(sum(rows.map(r=>r.net))).toLocaleString("en-PH")}</td></tr>
      </tbody></table></div>`,{note:"Transfers are shown but never subtracted twice"})}
    <div style="height:14px"></div>
    <div class="split-even" style="margin-bottom:14px">
      ${card(`Building wealth through ${y}`,`<div id="${wl}"></div>`,{note:"Savings, investing and protection"})}
      ${card(`Net cash flow by month, ${y}`,`<div id="${nf}"></div>`,{note:"Green kept, red overspent"})}
    </div>
    ${card("Net worth",hasNW?`
      <div class="split-even">
        <div><div class="card-title" style="margin-bottom:8px">Assets</div>
          ${S.assets.map(a=>`<div class="stat-row"><span>${esc(a.name)}</span>
            <b>${moneyPlain(+a.value||0,0)}
            <button class="btn btn-sm btn-ghost" data-act="del-nw" data-kind="assets" data-id="${a.id}">\u00D7</button></b></div>`).join("")
            ||`<div class="empty-sm">None listed.</div>`}
          <div class="stat-row" style="border-top:2px solid var(--line-2);margin-top:6px">
            <span><b>Total assets</b></span><b>${moneyPlain(assets,0)}</b></div></div>
        <div><div class="card-title" style="margin-bottom:8px">Liabilities</div>
          ${S.liabilities.map(a=>`<div class="stat-row"><span>${esc(a.name)}</span>
            <b>${moneyPlain(+a.value||0,0)}
            <button class="btn btn-sm btn-ghost" data-act="del-nw" data-kind="liabilities" data-id="${a.id}">\u00D7</button></b></div>`).join("")
            ||`<div class="empty-sm">None listed.</div>`}
          <div class="stat-row" style="border-top:2px solid var(--line-2);margin-top:6px">
            <span><b>Total liabilities</b></span><b>${moneyPlain(liabs,0)}</b></div></div>
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;
        justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px">
        <span class="kpi-label">Net worth \u00B7 assets minus liabilities</span>
        <span class="amt" style="font-size:26px">${moneyPlain(assets-liabs,0)}</span></div>
      <p class="card-note" style="margin-top:8px">These are balances you enter and maintain yourself.
        They are not derived from your transactions.</p>`
      :emptyState({glyph:"\u2696",title:"Net worth is not set up",
        body:"Add what you own and what you owe to see the difference. These are standing balances you keep up to date \u2014 the app will not guess them from your transactions.",
        action:`<button class="btn" data-act="add-nw" data-kind="assets">Add an asset</button>
                <button class="btn" data-act="add-nw" data-kind="liabilities">Add a liability</button>`}),
      {right:hasNW?`<button class="btn btn-sm" data-act="add-nw" data-kind="assets">Add asset</button>
        <button class="btn btn-sm" data-act="add-nw" data-kind="liabilities">Add liability</button>`:""})}
    <div style="height:14px"></div>
    ${card("Export",`<p class="card-note" style="margin:-4px 0 12px">Take your numbers with you. Everything stays on this device.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-act="export-json">Download all data (.json)</button>
        <button class="btn" data-act="export-csv">Download transactions (.csv)</button>
        <button class="btn" data-act="print">Print this report</button></div>`)}
  </div>`;
};

/* ============================================================
   STORAGE — your records survive closing the app.
   Three tiers, tried in order, each guarded so a blocked API can
   never stop the app from running:
     1. IndexedDB   durable, survives reloads and reboots
     2. localStorage fallback when IndexedDB is blocked
     3. memory       last resort; the app says so plainly
   ============================================================ */
const DB_NAME="peso_command_center", STORE_NAME="kv", STATE_KEY="state.v1", BACKUP_KEY="state.backup";

const Store=(function(){
  /* Decide synchronously whether ANY persistence exists, so the app never
     reports "session only" while it is still making up its mind. */
  function lsAvailable(){
    try{ const k="__pcc_probe"; window.localStorage.setItem(k,"1");
      window.localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }
  const HAS_LS = lsAvailable();
  let mode = HAS_LS ? "localstorage" : "memory";   /* provisional, upgraded below */
  let idb=null, timer=null;
  let lastSaved=null, lastError="";
  if(!HAS_LS) lastError="This browser is not allowing local storage. Opening the file straight from a "
    +"downloads folder is the usual cause \u2014 install the app, or host it, to keep your records.";

  function openIDB(){
    return new Promise(res=>{
      let req, settled=false;
      const done=v=>{ if(!settled){ settled=true; res(v); } };
      try{ if(!window.indexedDB) return done(null); req=window.indexedDB.open(DB_NAME,1); }
      catch(e){ return done(null); }
      req.onupgradeneeded=()=>{ try{ req.result.createObjectStore(STORE_NAME); }catch(e){} };
      req.onsuccess=()=>{ /* may land after the cap; upgrade the mode if so */
        if(settled){ idb=req.result; if(mode!=="memory") mode="indexeddb"; }
        done(req.result); };
      req.onerror=()=>done(null);
      req.onblocked=()=>done(null);
      setTimeout(()=>done(null),1200);       /* never delay the first paint */
    });
  }
  function idbPut(key,val){
    return new Promise((res,rej)=>{
      try{
        const tx=idb.transaction(STORE_NAME,"readwrite");
        tx.objectStore(STORE_NAME).put(val,key);
        tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
      }catch(e){ rej(e); }
    });
  }
  function idbGet(key){
    return new Promise(res=>{
      try{
        const tx=idb.transaction(STORE_NAME,"readonly");
        const r=tx.objectStore(STORE_NAME).get(key);
        r.onsuccess=()=>res(r.result); r.onerror=()=>res(undefined);
      }catch(e){ res(undefined); }
    });
  }

  /* Kicked off immediately; everything else waits on it rather than guessing. */
  const ready=(async function(){
    idb=await openIDB();
    if(idb) mode="indexeddb";
    else if(HAS_LS){ mode="localstorage";
      lastError=lastError||""; }
    try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    return mode;
  })();

  function lsKey(k){ return DB_NAME+":"+k; }
  /* No IndexedDB call is ever awaited without a cap. A hung transaction must not
     be able to stall a save forever. */
  function capped(promise,ms){
    return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
  }
  async function readRaw(key){
    try{ const v=window.localStorage.getItem(lsKey(key)); if(v) return v; }catch(e){}
    if(idb){ try{ const v=await capped(idbGet(key),1500); if(v) return v; }catch(e){} }
    return undefined;
  }
  /* localStorage first: it is synchronous and cheap, so one durable copy exists
     immediately. IndexedDB is then updated as the more resilient second copy. */
  async function writeRaw(key,text){
    let ok=false;
    try{ window.localStorage.setItem(lsKey(key),text); ok=true; }
    catch(e){ lastError="Local storage is full or blocked. Download a backup to be safe."; }
    if(idb){ try{ await capped(idbPut(key,text),1500); ok=true; }
      catch(e){ if(!ok) lastError="Could not write to storage on this device."; } }
    return ok;
  }

  /* Synchronous read of the mirrored copy so the first paint never waits
     on IndexedDB. The async load below then confirms against the durable store. */
  function loadSync(){
    try{
      const raw=window.localStorage.getItem(lsKey(STATE_KEY));
      if(!raw) return null;
      const data=JSON.parse(raw);
      return (data&&Array.isArray(data.transactions))?data:null;
    }catch(e){ return null; }
  }
  async function load(){
    await ready;
    try{
      const raw=await readRaw(STATE_KEY);
      if(!raw) return null;
      const data=JSON.parse(raw);
      if(!data||!Array.isArray(data.transactions)) return null;
      return data;
    }catch(e){ lastError="Saved data could not be read, so the app started empty."; return null; }
  }
  /* Saves are serialised on a promise chain, so a manual save that lands while a
     debounced one is in flight still reports the true result instead of a false failure. */
  let chain=Promise.resolve(false);
  async function doSave(){
    await ready;
    if(mode==="memory"){ updateBadge(); return false; }
    try{
      const ok=await writeRaw(STATE_KEY,JSON.stringify(S));
      if(ok){ lastSaved=new Date(); if(!/full|blocked/.test(lastError)) lastError=""; }
      return ok;
    }catch(e){ lastError=String(e&&e.message||e); return false; }
    finally{ updateBadge(); }
  }
  function saveNow(){ chain=chain.then(doSave,doSave); return chain; }

  /* Always schedules, even before init settles — the write itself waits. */
  function schedule(){
    if(!HAS_LS && mode==="memory"){ updateBadge(); return; }
    clearTimeout(timer);
    timer=setTimeout(saveNow,450);
    updateBadge(true);
  }
  async function backup(){ await ready; try{ await writeRaw(BACKUP_KEY,JSON.stringify(S)); }catch(e){} }
  async function restoreBackup(){
    await ready;
    const raw=await readRaw(BACKUP_KEY);
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }
  async function clear(){
    await ready;
    if(idb){ try{ await idbPut(STATE_KEY,""); }catch(e){} }
    try{ window.localStorage.removeItem(lsKey(STATE_KEY)); }catch(e){}
    lastSaved=null;
  }
  function status(){
    return { mode, lastSaved, lastError, durable: mode!=="memory",
      label: mode==="memory" ? "Not saved \u2014 session only" : "Saved on this device" };
  }
  return {ready,init:()=>ready,loadSync,load,saveNow,schedule,backup,restoreBackup,clear,status};
})();

/* small "saving / saved" indicator in the rail */
function updateBadge(pending){
  const el=document.getElementById("saveState"); if(!el) return;
  const st=Store.status();
  if(!st.durable){ el.innerHTML=`<span style="color:var(--warn)">\u25CF Session only</span>`; return; }
  if(pending){ el.innerHTML=`<span style="opacity:.75">Saving\u2026</span>`; return; }
  el.innerHTML=st.lastSaved
    ? `<span style="opacity:.75">Saved ${st.lastSaved.toLocaleTimeString("en-PH",
        {hour:"numeric",minute:"2-digit"})}</span>`
    : `<span style="opacity:.75">Saves automatically</span>`;
}

function download(name,text,type){
  const b=new Blob([text],{type:type||"application/json"});
  const u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),800);
}
function exportJSON(){
  download(`peso-command-center-${iso(new Date())}.json`,JSON.stringify(S,null,2));
  DIRTY=false; toast("Data downloaded");
}
const CSV_COLS=["date","pillar","category","subcategory","description","needWant","account","method","amount","status","notes"];
function exportCSV(){
  const q=v=>{ const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[CSV_COLS.join(",")].concat(S.transactions.map(t=>CSV_COLS.map(c=>q(t[c])).join(",")));
  download(`transactions-${iso(new Date())}.csv`,rows.join("\n"),"text/csv");
  toast("Transactions exported");
}
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=="\r") cur+=c;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
function pickFile(accept,cb){
  const i=document.createElement("input"); i.type="file"; i.accept=accept;
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>cb(r.result,f.name); r.onerror=()=>toast("That file could not be read",true);
    r.readAsText(f); };
  i.click();
}
function importJSON(){
  pickFile(".json,application/json",async txt=>{
    try{
      const d=JSON.parse(txt);
      if(!d||!Array.isArray(d.transactions)) throw 0;
      await Store.backup();
      S=Object.assign(freshState(),d);
      S.settings=Object.assign(freshState().settings,d.settings||{});
      S.settings.health=Object.assign(freshState().settings.health,(d.settings||{}).health||{});
      S.settings.lateIncome=Object.assign(freshState().settings.lateIncome,(d.settings||{}).lateIncome||{});
      DIRTY=false; Store.saveNow(); render(); toast(`Loaded ${S.transactions.length} transaction${S.transactions.length===1?"":"s"}`);
    }catch(e){ toast("That file is not a saved command center file",true); }
  });
}
function importCSV(){
  pickFile(".csv,text/csv",txt=>{
    const rows=parseCSV(txt);
    if(rows.length<2) return toast("That file has no rows to import",true);
    const head=rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z]/g,""));
    const idx={}; CSV_COLS.forEach(c=>idx[c]=head.indexOf(c.toLowerCase()));
    if(idx.date<0||idx.amount<0) return toast("The file needs at least a date and amount column",true);
    let ok=0, skipped=0;
    rows.slice(1).forEach(r=>{
      const get=c=>idx[c]>=0?String(r[idx[c]]||"").trim():"";
      const amount=parseFloat(get("amount").replace(/[^0-9.\-]/g,""));
      const date=get("date");
      if(!date||!isFinite(amount)||amount<=0){ skipped++; return; }
      const pillar=PILLARS.find(p=>p.toLowerCase()===get("pillar").toLowerCase())||"Spending";
      S.transactions.push({ id:uid(), date, pillar, category:get("category")||"Other "+pillar,
        subcategory:get("subcategory"), description:get("description"), needWant:get("needWant"),
        account:get("account"), method:get("method"), amount,
        status:STATUSES.find(s=>s.toLowerCase()===get("status").toLowerCase())||"Paid", notes:get("notes") });
      ok++;
    });
    markDirty(); render();
    toast(`Imported ${ok} transaction${ok===1?"":"s"}${skipped?` \u00B7 ${skipped} skipped`:""}`);
  });
}

/* ---------------- boot ---------------- */
function adopt(saved){
  if(!saved) return false;
  const base=freshState();
  S=Object.assign(base,saved);
  S.settings=Object.assign(base.settings,saved.settings||{});
  S.settings.health=Object.assign(base.settings.health,(saved.settings||{}).health||{});
  S.settings.lateIncome=Object.assign(base.settings.lateIncome,(saved.settings||{}).lateIncome||{});
  S.settings.categories=Object.assign(base.settings.categories,(saved.settings||{}).categories||{});
  return true;
}
(function init(){
  /* Paint immediately from the synchronous mirror. */
  const fast=Store.loadSync();
  adopt(fast);
  PERIOD={mode:S.settings.defaultPeriod||"current",y:CUR_Y,m:CUR_M};
  render();

  /* Then confirm against the durable store, and redraw only if it holds more. */
  (async ()=>{
    await Store.ready;
    try{
      const full=await Store.load();
      if(full && (!fast || JSON.stringify(full)!==JSON.stringify(fast))){
        const keepRoute=ROUTE;
        adopt(full); ROUTE=keepRoute;
        PERIOD={mode:S.settings.defaultPeriod||"current",y:CUR_Y,m:CUR_M};
        render();
      }
    }catch(e){ console.error(e); }
    updateBadge();
    if(!Store.status().durable) setTimeout(()=>toast(
      "Nothing can be saved here \u2014 open Settings to fix it.",true),900);
    if("serviceWorker" in navigator && location.protocol.startsWith("http")){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  })();
})();

</script>
</body>
</html>
