<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Personal finance command center in Philippine Peso — income, savings, spending, expenditure, investment and protection in one dashboard.">
<title>Peso Command Center — Personal Finance</title>
<meta name="theme-color" content="#0B1F26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peso CC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PESO COMMAND CENTER — design tokens
   Palette: deep petrol rail, paper canvas, brass accent.
   Pillar hues are semantic and fixed (see brief).
   ============================================================ */
:root{
  --rail:#0B1F26; --rail-2:#12313B; --rail-3:#1B4A58; --rail-txt:#C9DCE0;
  --canvas:#F5F7F6; --surface:#FFFFFF; --surface-2:#FAFBFA;
  --line:#E3E7E6; --line-2:#CFD6D5;
  --text:#0F1D1B; --text-2:#586A67; --text-3:#8697945;
  --text-3:#869794;
  --brass:#A97C2E; --brass-2:#C69A46; --brass-soft:#F5EDDD;

  --income:#1C7F55; --income-s:#E4F1EB;
  --savings:#0C7D80; --savings-s:#DFEFEF;
  --spending:#AE382F; --spending-s:#F7E6E4;
  --expend:#B3711A;  --expend-s:#F9EEDC;
  --invest:#2A578F;  --invest-s:#E3EAF3;
  --protect:#61458C; --protect-s:#EDE8F4;
  --neutral:#6B7A78; --neutral-s:#ECEFEE;

  --ok:#1C7F55; --warn:#B3711A; --bad:#AE382F;

  --r:7px; --r-lg:11px;
  --sh:0 1px 2px rgba(11,31,38,.05), 0 1px 3px rgba(11,31,38,.04);
  --sh-2:0 4px 16px rgba(11,31,38,.09);
  --rail-w:238px;
  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-b:"Public Sans","Segoe UI",system-ui,sans-serif;
}
[data-theme="dark"]{
  --canvas:#0C1518; --surface:#121E22; --surface-2:#16252A;
  --line:#22353B; --line-2:#2E464E;
  --text:#E8EFEE; --text-2:#9DB0AE; --text-3:#748A88;
  --brass-soft:#2A2216;
  --income-s:#12291F; --savings-s:#0E2626; --spending-s:#2B1614;
  --expend-s:#2A1F0D; --invest-s:#141F2C; --protect-s:#1E1729; --neutral-s:#1B2A2D;
  --income:#3FA97A; --savings:#22A3A6; --spending:#D96055; --expend:#D79437;
  --invest:#5288C4; --protect:#8D6DBD; --ok:#3FA97A; --warn:#D79437; --bad:#D96055;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 22px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--text);
  font-family:var(--f-b); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-d); margin:0; font-weight:600; letter-spacing:-.012em}
button,input,select,textarea{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh}
.rail{
  width:var(--rail-w); flex:0 0 var(--rail-w); background:var(--rail);
  color:var(--rail-txt); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.rail-brand{padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.07)}
.rail-mark{display:flex; align-items:center; gap:10px}
.rail-glyph{
  width:30px; height:30px; border-radius:6px; background:var(--brass);
  color:#1A1206; font-family:var(--f-d); font-weight:700; font-size:17px;
  display:grid; place-items:center; flex:0 0 auto;
}
.rail-name{font-family:var(--f-d); font-weight:600; font-size:13.5px; color:#fff; letter-spacing:-.01em; line-height:1.15}
.rail-sub{font-size:10.5px; color:#7E9BA2; letter-spacing:.08em; text-transform:uppercase; margin-top:2px}
.rail-nav{flex:1; min-width:0; overflow-y:auto; padding:12px 10px 20px}
.rail-group{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:#5F8089;
  padding:14px 8px 6px; font-family:var(--f-d); font-weight:600}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; border:0; background:none; color:var(--rail-txt);
  border-radius:6px; cursor:pointer; font-size:13.5px; transition:background .13s,color .13s;
}
.nav-item:hover{background:var(--rail-2); color:#fff}
.nav-item[aria-current="page"]{background:var(--rail-3); color:#fff; font-weight:600}
.nav-item .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto; background:currentColor; opacity:.55}
.nav-item[aria-current="page"] .dot{opacity:1}
.nav-badge{margin-left:auto; font-size:10.5px; background:var(--brass); color:#1A1206;
  padding:1px 6px; border-radius:20px; font-weight:700; font-family:var(--f-d)}
.rail-foot{padding:12px 16px 16px; border-top:1px solid rgba(255,255,255,.07); font-size:11px; color:#6E8D95}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
/* grid and flex children default to min-width:auto, which lets wide tables and
   nowrap amounts push the whole page sideways. Reset it everywhere it matters. */
.split>*,.split-even>*,.grid>*,.kpi-grid>*{min-width:0}
.card,.kpi,.goal-card{min-width:0; overflow:hidden}
.tbl-wrap{max-width:100%}
.kpi-row{min-width:0}
.kpi-row span:first-child{min-width:0; overflow:hidden; text-overflow:ellipsis}
.hero-wrap>*{min-width:0}

/* ---------- header ---------- */
.hdr{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 22px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.period{display:flex; align-items:center; gap:8px}
.period-btn{
  display:flex; align-items:center; gap:9px; background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:var(--r); padding:6px 11px;
  cursor:pointer; font-family:var(--f-d); font-weight:600; font-size:13.5px;
}
.period-btn:hover{border-color:var(--brass)}
.period-btn .caret{color:var(--text-3); font-size:10px}
.period-tag{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3);
  font-family:var(--f-d); font-weight:600}
.hdr-spacer{flex:1}
.search{position:relative; width:min(280px,34vw)}
.search input{
  width:100%; padding:7px 10px 7px 30px; border:1px solid var(--line-2);
  border-radius:var(--r); background:var(--surface-2); font-size:13px;
}
.search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-3)}
.icon-btn{
  position:relative; width:34px; height:34px; border:1px solid var(--line-2);
  background:var(--surface-2); border-radius:var(--r); cursor:pointer;
  display:grid; place-items:center; color:var(--text-2);
}
.icon-btn:hover{border-color:var(--brass); color:var(--text)}
.icon-btn .pip{position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px;
  background:var(--bad); color:#fff; border-radius:9px; font-size:10px; font-weight:700;
  display:grid; place-items:center; font-family:var(--f-d)}
.btn{
  border:1px solid transparent; border-radius:var(--r); padding:7px 13px; cursor:pointer;
  font-family:var(--f-d); font-weight:600; font-size:13px; display:inline-flex;
  align-items:center; gap:7px; background:var(--surface-2); color:var(--text); border-color:var(--line-2);
}
.btn:hover{border-color:var(--brass)}
.btn-primary{background:var(--brass); color:#1A1206; border-color:var(--brass)}
.btn-primary:hover{background:var(--brass-2); border-color:var(--brass-2)}
.btn-ghost{background:none; border-color:transparent; color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2); color:var(--text)}
.btn-sm{padding:4px 9px; font-size:12px}
.btn-danger{color:var(--bad); border-color:var(--line-2)}
.btn-danger:hover{border-color:var(--bad); background:var(--spending-s)}

/* ---------- page ---------- */
.page{padding:22px 22px 90px; max-width:1560px; width:100%}
.page-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.eyebrow{font-family:var(--f-d); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--text-3); font-weight:600; margin-bottom:5px}
.page-title{font-size:26px; letter-spacing:-.022em}
.page-sub{color:var(--text-2); font-size:13.5px; margin-top:3px}
.page-head-actions{margin-left:auto; display:flex; gap:8px; align-items:center}

.grid{display:grid; gap:14px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh); padding:16px;
}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.card-title{font-family:var(--f-d); font-size:13.5px; font-weight:600; letter-spacing:-.005em}
.card-note{font-size:11.5px; color:var(--text-3)}
.card-head .right{margin-left:auto; display:flex; gap:6px; align-items:center}

/* ---------- money typography ---------- */
.amt{font-family:var(--f-d); font-weight:600; letter-spacing:-.026em;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.amt .cur{font-size:.63em; font-weight:600; opacity:.68; margin-right:.09em; letter-spacing:0}
.amt.neg{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* ---------- KPI ---------- */
.kpi-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
/* the dashboard shows exactly six pillars — lay them out 3x2 rather than 5+1 */
.kpi-grid.six{grid-template-columns:repeat(3,1fr)}
@media (max-width:1080px){ .kpi-grid.six{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .kpi-grid.six{grid-template-columns:1fr} }
.kpi{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:14px 15px; box-shadow:var(--sh); position:relative; overflow:hidden;
}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--k,var(--neutral))}
.kpi-top{display:flex; align-items:center; gap:7px; margin-bottom:9px}
.kpi-label{font-family:var(--f-d); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  font-weight:600; color:var(--text-2)}
.kpi-val{font-size:26px; line-height:1.08}
.kpi-meta{margin-top:9px; display:flex; flex-direction:column; gap:5px}
.kpi-row{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--text-2)}
.kpi-row b{font-weight:600; color:var(--text); font-variant-numeric:tabular-nums}
.kpi-hero{grid-column:1/-1; border-left:0}
.kpi-hero::before{width:0}
.kpi-hero{border:1px solid var(--brass); background:linear-gradient(180deg,var(--brass-soft),var(--surface) 62%)}
[data-theme="dark"] .kpi-hero{background:linear-gradient(180deg,#241C10,var(--surface) 62%)}
.hero-wrap{display:flex; gap:26px; align-items:center; flex-wrap:wrap}
.hero-main{min-width:210px}
.hero-val{font-size:40px; line-height:1}
.hero-eq{font-size:12px; color:var(--text-2); margin-top:8px; font-variant-numeric:tabular-nums}
.hero-eq b{color:var(--text)}

/* ---------- bars / meters ---------- */
.meter{height:7px; background:var(--neutral-s); border-radius:20px; overflow:hidden; position:relative}
.meter > i{display:block; height:100%; border-radius:20px; background:var(--m,var(--neutral)); transition:width .5s cubic-bezier(.22,.8,.3,1)}
.meter.thin{height:5px}
.meter .tick{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); opacity:.5}
.pace{position:relative; padding-top:16px}
.pace-flag{position:absolute; top:0; transform:translateX(-50%); font-size:10px; color:var(--text-2);
  white-space:nowrap; font-family:var(--f-d); font-weight:600}
.pace-flag::after{content:""; position:absolute; left:50%; top:13px; width:1px; height:9px; background:var(--line-2)}

/* ---------- badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px;
  font-size:11.5px; font-weight:600; font-family:var(--f-d); white-space:nowrap;
  background:var(--neutral-s); color:var(--text-2);
}
.badge .bdot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto}
.badge.ok{background:var(--income-s); color:var(--ok)}
.badge.warn{background:var(--expend-s); color:var(--warn)}
.badge.bad{background:var(--spending-s); color:var(--bad)}
.badge.info{background:var(--invest-s); color:var(--invest)}
.pill{font-size:11px; padding:2px 7px; border-radius:5px; font-weight:600; font-family:var(--f-d)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:0 -16px}
.tbl{width:100%; border-collapse:collapse; font-size:13px; min-width:560px}
.tbl th{
  text-align:left; font-family:var(--f-d); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-3); font-weight:600;
  padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface);
}
.tbl td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl .strong{font-weight:600}
.tbl tr.total td{border-top:2px solid var(--line-2); font-weight:700; background:var(--surface-2)}
.swatch{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:7px; vertical-align:-1px}

/* ---------- allocation ribbon (signature) ---------- */
.ribbon-wrap{padding-top:2px}
.ribbon{display:flex; height:42px; border-radius:7px; overflow:hidden; background:var(--neutral-s);
  border:1px solid var(--line)}
.ribbon > span{
  position:relative; display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--f-d); font-weight:700; font-size:11.5px;
  transition:flex-grow .5s cubic-bezier(.22,.8,.3,1); min-width:0; overflow:hidden;
}
.ribbon > span.tiny{font-size:0}
.ribbon-legend{display:flex; flex-wrap:wrap; gap:5px 18px; margin-top:11px}
.rl{display:flex; align-items:center; gap:7px; font-size:12px}
.rl .swatch{margin:0}
.rl b{font-variant-numeric:tabular-nums; font-weight:600}
.rl span.muted{color:var(--text-3)}
.ribbon-empty{height:42px; border:1px dashed var(--line-2); border-radius:7px; display:grid;
  place-items:center; color:var(--text-3); font-size:12.5px}
.per100{font-size:12px; color:var(--text-2); margin-top:12px; padding-top:11px; border-top:1px dashed var(--line)}
.per100 b{color:var(--text); font-variant-numeric:tabular-nums}

/* ---------- attention ---------- */
.att{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0; padding-bottom:0}
.att-ic{width:24px; height:24px; border-radius:6px; display:grid; place-items:center; flex:0 0 auto;
  font-size:12px; font-weight:700; font-family:var(--f-d)}
.att-ic.ok{background:var(--income-s); color:var(--ok)}
.att-ic.warn{background:var(--expend-s); color:var(--warn)}
.att-ic.bad{background:var(--spending-s); color:var(--bad)}
.att-ic.info{background:var(--neutral-s); color:var(--text-2)}
.att-b{min-width:0}
.att-t{font-family:var(--f-d); font-weight:600; font-size:13px; margin-bottom:2px}
.att-d{font-size:12.5px; color:var(--text-2)}
.att-link{background:none; border:0; padding:0; color:var(--brass); font-size:12px; cursor:pointer;
  font-family:var(--f-d); font-weight:600; margin-top:3px}
.att-link:hover{text-decoration:underline}

/* ---------- empty / error ---------- */
.empty{text-align:center; padding:38px 20px}
.empty-glyph{width:46px; height:46px; margin:0 auto 14px; border-radius:11px; background:var(--surface-2);
  border:1px dashed var(--line-2); display:grid; place-items:center; color:var(--text-3);
  font-family:var(--f-d); font-size:20px; font-weight:700}
.empty h3{font-size:16px; margin-bottom:6px}
.empty p{color:var(--text-2); font-size:13px; max-width:400px; margin:0 auto 14px}
.empty-list{max-width:400px; margin:0 auto; text-align:left; font-size:12.5px; color:var(--text-2)}
.empty-list li{margin:4px 0}
.empty-sm{padding:24px 14px; text-align:center; color:var(--text-3); font-size:12.5px}

/* ---------- forms ---------- */
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-family:var(--f-d); font-size:11px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--text-2); font-weight:600}
.field input,.field select,.field textarea{
  padding:8px 10px; border:1px solid var(--line-2); border-radius:var(--r);
  background:var(--surface); font-size:13.5px; width:100%;
}
.field input:focus,.field select:focus{border-color:var(--brass)}
.field .hint{font-size:11px; color:var(--text-3)}
.field-row{display:grid; gap:11px; grid-template-columns:1fr 1fr}
.inline-add{display:flex; gap:6px; align-items:center}
.inline-add input{flex:1}
.switch{display:flex; align-items:center; gap:10px; cursor:pointer}
.switch input{appearance:none; width:36px; height:20px; border-radius:20px; background:var(--line-2);
  position:relative; cursor:pointer; transition:background .16s; flex:0 0 auto}
.switch input::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:#fff; transition:left .16s}
.switch input:checked{background:var(--brass)}
.switch input:checked::after{left:18px}
.amount-input{position:relative}
.amount-input input{padding-left:26px}
.amount-input::before{content:"\20B1"; position:absolute; left:10px; top:50%; transform:translateY(-50%);
  color:var(--text-3); font-family:var(--f-d); font-weight:600; z-index:1}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(8,20,24,.5); z-index:80; display:grid;
  place-items:center; padding:18px; overflow-y:auto}
.modal{background:var(--surface); border-radius:var(--r-lg); width:100%; max-width:560px;
  box-shadow:var(--sh-2); border:1px solid var(--line); max-height:92vh; display:flex; flex-direction:column}
.modal.wide{max-width:760px}
.modal-head{padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
.modal-head h3{font-size:15.5px}
.modal-body{padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:13px}
.modal-foot{padding:13px 18px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end;
  background:var(--surface-2); border-radius:0 0 var(--r-lg) var(--r-lg)}
.seg{display:flex; gap:0; border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden}
.seg button{flex:1; padding:7px 6px; border:0; background:var(--surface); cursor:pointer; font-size:12.5px;
  font-family:var(--f-d); font-weight:600; color:var(--text-2); border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--p,var(--rail)); color:#fff}

/* ---------- toast ---------- */
.toasts{position:fixed; bottom:20px; right:20px; z-index:120; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--rail); color:#fff; padding:10px 14px; border-radius:var(--r); font-size:13px;
  box-shadow:var(--sh-2); display:flex; align-items:center; gap:9px; animation:tin .22s ease}
.toast.bad{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- charts ---------- */
.chart{width:100%; display:block; overflow:visible}
.chart text{font-family:var(--f-b); fill:var(--text-3); font-size:10.5px}
.chart .axis-line{stroke:var(--line); stroke-width:1}
.chart .grid-line{stroke:var(--line); stroke-width:1; stroke-dasharray:2 4}
.chart .hit{fill:transparent; cursor:pointer}
.chart .bar{transition:opacity .12s}
.chart .dim{opacity:.32}
.tip{
  position:fixed; z-index:200; background:var(--rail); color:#fff; padding:7px 10px; border-radius:6px;
  font-size:12px; pointer-events:none; box-shadow:var(--sh-2); max-width:230px; line-height:1.45;
}
.tip .tip-t{font-family:var(--f-d); font-weight:700; margin-bottom:3px; font-size:11.5px}

<body>
<a href="#view" class="sr">Skip to content</a>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="hdr" id="hdr"></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<script>
/* ============================================================
   1. CONFIGURATION — the financial vocabulary of the product
   ============================================================ */
const PILLARS = ["Income","Savings","Spending","Expenditure","Investment","Protection"];

/* How each pillar moves money. This is the rule that stops double counting. */
const FLOW = {
  Income:"inflow", Spending:"expense", Expenditure:"expense",
  Savings:"transfer", Investment:"transfer", Protection:"transfer"
};
/* Direction of "good". Spending and Expenditure are the only ones where less is better. */
const HIGHER_BETTER = {
  Income:true, Savings:true, Spending:false, Expenditure:false, Investment:true, Protection:true
};
const HUE = {
  Income:"var(--income)", Savings:"var(--savings)", Spending:"var(--spending)",
  Expenditure:"var(--expend)", Investment:"var(--invest)", Protection:"var(--protect)",
  Unallocated:"var(--neutral)", Net:"var(--brass)"
};
const HUE_SOFT = {
  Income:"var(--income-s)", Savings:"var(--savings-s)", Spending:"var(--spending-s)",
  Expenditure:"var(--expend-s)", Investment:"var(--invest-s)", Protection:"var(--protect-s)",
  Unallocated:"var(--neutral-s)"
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const DEFAULT_CATEGORIES = {
  Income:["Salary","Freelance","Business","Side Hustle","Commission","Bonus","13th Month Pay",
          "Allowance","Interest","Dividends","Rental Income","Refund","Other Income"],
  Savings:["Emergency Fund","General Savings","Vacation Fund","Education Fund","Major Purchase",
           "Sinking Fund","Retirement Savings","Other Savings"],
  Spending:["Food & Groceries","Dining Out","Rent","Electricity","Water","Internet","Communication",
            "Transportation","Fuel","Household","Personal Care","Healthcare","Entertainment",
            "Subscriptions","Shopping","Clothing","Education","Childcare","Pets","Gifts & Donations",
            "Fees & Charges","Other Spending"],
  Expenditure:["Appliances","Electronics","Furniture","Home Improvement","Vehicle","Tuition",
               "Medical Procedure","Travel","Celebration","Professional Fees","Licenses & Permits",
               "Debt Repayment","Taxes","Other Expenditure"],
  Investment:["Stocks","Bonds","ETFs","Mutual Funds","UITF","Index Funds","Pag-IBIG MP2",
              "Real Estate","Business Capital","Cryptocurrency","Other Investment"],
  Protection:["Emergency Fund","Health Insurance / HMO","Life Insurance","Property Insurance",
              "Vehicle Insurance","Emergency Cash","Sinking Fund","Debt Protection",
              "SSS / GSIS","PhilHealth","Pag-IBIG","Other Protection"]
};
const DEFAULT_ACCOUNTS = ["Cash on Hand","BPI","BDO","Metrobank","Landbank","UnionBank","Security Bank",
  "GCash","Maya","SeaBank","CIMB","Credit Card","Other Account"];
const DEFAULT_METHODS = ["Cash","GCash","Maya","Debit Card","Credit Card","Bank Transfer","InstaPay",
  "PESONet","Auto-debit","Cheque","Payroll","Other"];
const STATUSES = ["Planned","Upcoming","Paid","Partially Paid","Cancelled"];
const NEED_WANT = ["Need","Want","Not applicable"];
const ASSET_CLASSES = ["Stocks","Bonds","ETFs","Mutual Funds","UITF","Index Funds","Pag-IBIG MP2",
  "Real Estate","Business","Retirement","Cryptocurrency","Other"];

/* ============================================================
   2. STATE — one source of truth. Nothing is hard-coded into a view.
   ============================================================ */
const today = new Date();
const CUR_Y = today.getFullYear(), CUR_M = today.getMonth();

function blankBudget(){
  return {Income:0,Savings:0,Spending:0,Expenditure:0,Investment:0,Protection:0};
}
function freshState(){
  return {
    meta:{ version:1, created:new Date().toISOString() },
    settings:{
      ownerName:"",
      currencySymbol:"\u20B1", locale:"en-PH",
      defaultPeriod:"current",
      theme:"light",
      lateIncome:{ enabled:false, cutoffDay:26 },
      health:{
        weights:{ income:15, savings:25, spending:20, investment:15, protection:10, cashflow:15 },
        strong:80, fair:60,
        overspendZero:0.5    /* spending 50% over budget scores zero */
      },
      categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
      accounts:[...DEFAULT_ACCOUNTS],
      methods:[...DEFAULT_METHODS],
      emergencyMonths:6
    },
    transactions:[],
    budgets:{},            /* "2026-08" -> {Income:.., Savings:.., ...} */
    goals:[],              /* {id,name,target,current,deadline,monthly} */
    protectionTargets:{},  /* category -> target amount */
    holdings:[],           /* {id,class,name,invested,value} */
    assets:[], liabilities:[]
  };
}
let S = freshState();

/* period selection lives outside the saved file — it is a view, not data */
let PERIOD = { mode:"current", y:CUR_Y, m:CUR_M, from:null, to:null };
let ROUTE = "dashboard";
let SEARCH = "";
let DIRTY = false;

/* ============================================================
   3. UTILITIES
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,10);
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const sum = a=>a.reduce((x,y)=>x+y,0);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Money. Never renders NaN, Infinity or undefined — those become a clean dash. */
function money(n,{decimals=0,sign=false}={}){
  if(n===null||n===undefined||!isFinite(n)) return '<span class="amt">&mdash;</span>';
  const neg = n<0, v = Math.abs(n);
  const s = v.toLocaleString("en-PH",{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
  const pre = neg ? "\u2212" : (sign && n>0 ? "+" : "");
  return `<span class="amt${neg?" neg":""}">${pre}<span class="cur">\u20B1</span>${s}</span>`;
}
function moneyPlain(n,d=2){
  if(!isFinite(n)) return "\u2014";
  return (n<0?"\u2212":"")+"\u20B1"+Math.abs(n).toLocaleString("en-PH",
    {minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(n,d=1){ return isFinite(n) ? (n*100).toFixed(d)+"%" : "\u2014"; }
/* safe ratio — the only place division happens, so no NaN can leak into a view */
function ratio(a,b){ return (!b || !isFinite(b)) ? null : a/b; }

const pad2 = n=>String(n).padStart(2,"0");
const mKey = (y,m)=>`${y}-${pad2(m+1)}`;
const parseDate = s=>{ const d=new Date(s+"T00:00:00"); return isNaN(d)?null:d; };
const iso = d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fmtDate = s=>{ const d=parseDate(s); return d? `${pad2(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}` : "\u2014"; };
const daysIn = (y,m)=>new Date(y,m+1,0).getDate();

/* ---- late-income rule -------------------------------------------------
   Income received on or after the cutoff day can be treated as next month's
   disposable income. Off by default and never applied silently. */
function effDate(tx){
  const d = parseDate(tx.date); if(!d) return null;
  const li = S.settings.lateIncome;
  if(li.enabled && tx.pillar==="Income" && d.getDate() >= li.cutoffDay){
    return new Date(d.getFullYear(), d.getMonth()+1, 1);
  }
  return d;
}
function isShifted(tx){
  const d = parseDate(tx.date); if(!d) return false;
  const li = S.settings.lateIncome;
  return li.enabled && tx.pillar==="Income" && d.getDate() >= li.cutoffDay;
}

/* ---- period resolution ---- */
function resolvePeriod(p=PERIOD){
  const mk=(y,m)=>({from:new Date(y,m,1), to:new Date(y,m+1,0), label:`${MONTHS[m]} ${y}`,
                    isMonth:true, y, m, key:mKey(y,m)});
  switch(p.mode){
    case "current": return mk(CUR_Y,CUR_M);
    case "previous":{ const d=new Date(CUR_Y,CUR_M-1,1); return mk(d.getFullYear(),d.getMonth()); }
    case "month": return mk(p.y,p.m);
    case "ytd": return {from:new Date(CUR_Y,0,1), to:new Date(CUR_Y,CUR_M+1,0),
                        label:`Year to date \u00B7 ${CUR_Y}`, isMonth:false, y:CUR_Y, ytd:true};
    case "year": return {from:new Date(p.y,0,1), to:new Date(p.y,11,31),
                        label:`Full year ${p.y}`, isMonth:false, y:p.y, full:true};
    case "custom":{
      const f=parseDate(p.from)||new Date(CUR_Y,CUR_M,1), t=parseDate(p.to)||new Date(CUR_Y,CUR_M+1,0);
      return {from:f, to:t, label:`${fmtDate(iso(f))} \u2013 ${fmtDate(iso(t))}`, isMonth:false, custom:true};
    }
  }
  return mk(CUR_Y,CUR_M);
}
function prevPeriod(){
  const p=resolvePeriod();
  if(p.isMonth){ const d=new Date(p.y,p.m-1,1); return {from:new Date(d.getFullYear(),d.getMonth(),1),
    to:new Date(d.getFullYear(),d.getMonth()+1,0), label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`, isMonth:true,
    y:d.getFullYear(), m:d.getMonth(), key:mKey(d.getFullYear(),d.getMonth())}; }
  const span = p.to-p.from;
  return {from:new Date(p.from.getTime()-span-864e5), to:new Date(p.from.getTime()-864e5),
          label:"previous period", isMonth:false};
}

/* ============================================================
   4. FINANCIAL CALCULATION LAYER
   Pure functions. No DOM, no formatting. Views only read from here.
   ============================================================ */
function txInRange(from,to,list=S.transactions){
  return list.filter(t=>{
    if(t.status==="Cancelled") return false;
    const d=effDate(t); return d && d>=from && d<=to;
  });
}
function periodTx(p=resolvePeriod()){ return txInRange(p.from,p.to); }

function totalByPillar(list){
  const o={}; PILLARS.forEach(p=>o[p]=0);
  list.forEach(t=>{ if(o[t.pillar]!==undefined) o[t.pillar]+=(+t.amount||0); });
  return o;
}
function totalIncome(l){ return totalByPillar(l).Income; }
function totalSavings(l){ return totalByPillar(l).Savings; }
function totalSpending(l){ return totalByPillar(l).Spending; }
function totalExpenditure(l){ return totalByPillar(l).Expenditure; }
function totalInvestment(l){ return totalByPillar(l).Investment; }
function totalProtection(l){ return totalByPillar(l).Protection; }
/* true expenses only — transfers are your money moved, not money gone */
function totalExpenses(l){ const t=totalByPillar(l); return t.Spending+t.Expenditure; }
function totalTransfers(l){ const t=totalByPillar(l); return t.Savings+t.Investment+t.Protection; }
function netCashFlow(l){ const t=totalByPillar(l); return t.Income-t.Spending-t.Expenditure; }
function unallocated(l){ return netCashFlow(l)-totalTransfers(l); }
function savingsRate(l){ return ratio(totalSavings(l), totalIncome(l)); }
function investmentRate(l){ return ratio(totalInvestment(l), totalIncome(l)); }

function byCategory(list,pillar){
  const m=new Map();
  list.filter(t=>t.pillar===pillar).forEach(t=>m.set(t.category,(m.get(t.category)||0)+(+t.amount||0)));
  return [...m.entries()].map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
}
function byField(list,field,filterFn){
  const m=new Map();
  list.filter(filterFn||(()=>true)).forEach(t=>{
    const k=t[field]||"Unspecified"; m.set(k,(m.get(k)||0)+(+t.amount||0));
  });
  return [...m.entries()].map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
}

/* budget for a period. Month periods read that month's plan; multi-month
   periods add up each month's plan so budget and actual cover the same span. */
function budgetFor(p=resolvePeriod()){
  if(p.isMonth) return {...blankBudget(), ...(S.budgets[p.key]||{})};
  const out=blankBudget();
  let d=new Date(p.from.getFullYear(),p.from.getMonth(),1);
  while(d<=p.to){
    const b=S.budgets[mKey(d.getFullYear(),d.getMonth())];
    if(b) PILLARS.forEach(k=>out[k]+=(+b[k]||0));
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  return out;
}
function hasBudget(b){ return PILLARS.some(p=>(+b[p]||0)>0); }

/* variance is always expressed as "favourable +" so a single sign rule works */
function variance(pillar,actual,budget){
  if(!budget) return null;
  return HIGHER_BETTER[pillar] ? actual-budget : budget-actual;
}
function budgetStatus(pillar,actual,budget){
  if(!budget) return {key:"none", label:"No target set", tone:"info"};
  const r = actual/budget;
  if(HIGHER_BETTER[pillar]){
    if(r>=1) return {key:"met", label:"Target met", tone:"ok"};
    if(r>=0.8) return {key:"near", label:"Close to target", tone:"warn"};
    return {key:"short", label:"Behind target", tone:"bad"};
  }
  if(r>1) return {key:"over", label:"Over budget", tone:"bad"};
  if(r>=0.9) return {key:"near", label:"Near limit", tone:"warn"};
  return {key:"within", label:"Within budget", tone:"ok"};
}

/* how far through the period we are — powers the pace comparison */
function periodElapsed(p=resolvePeriod()){
  const now=new Date(); now.setHours(0,0,0,0);
  if(now<p.from) return {frac:0, day:0, total:Math.round((p.to-p.from)/864e5)+1, future:true};
  const total=Math.round((p.to-p.from)/864e5)+1;
  if(now>p.to) return {frac:1, day:total, total, past:true};
  const day=Math.round((now-p.from)/864e5)+1;
  return {frac:day/total, day, total};
}

function goalProgress(g){
  const cur=+g.current||0, tgt=+g.target||0;
  const prog=ratio(cur,tgt);
  let status={key:"active",label:"In progress",tone:"info"};
  if(tgt>0 && cur>=tgt) status={key:"done",label:"Completed",tone:"ok"};
  else if(g.deadline){
    const dl=parseDate(g.deadline);
    if(dl){
      const now=new Date(); now.setHours(0,0,0,0);
      const monthsLeft=Math.max(0,(dl.getFullYear()-now.getFullYear())*12+(dl.getMonth()-now.getMonth()));
      const needed=(tgt-cur)/Math.max(1,monthsLeft);
      if(dl<now && cur<tgt) status={key:"missed",label:"Past deadline",tone:"bad"};
      else if(g.monthly>0 && needed>g.monthly*1.05) status={key:"behind",label:"Behind pace",tone:"warn"};
      else status={key:"track",label:"On track",tone:"ok"};
    }
  }
  return {progress:prog, remaining:Math.max(0,tgt-cur), status};
}

/* Financial health. Configurable, and it only ever measures your own targets. */
function healthScore(p=resolvePeriod()){
  const list=periodTx(p), t=totalByPillar(list), b=budgetFor(p);
  const w=S.settings.health.weights, zero=S.settings.health.overspendZero;
  const parts=[];
  const goalPart=(key,label,pillar)=>{
    const target=b[pillar];
    if(!target) return parts.push({key,label,weight:w[key],score:null,counted:false,
      why:"No target set on the Budget page."});
    const r=clamp(t[pillar]/target,0,1);
    parts.push({key,label,weight:w[key],score:r*100,counted:true,
      why:`${moneyPlain(t[pillar],0)} of ${moneyPlain(target,0)} target.`});
  };
  goalPart("income","Income vs target","Income");
  goalPart("savings","Savings vs target","Savings");
  if(!b.Spending) parts.push({key:"spending",label:"Spending control",weight:w.spending,score:null,
    counted:false,why:"No spending budget set."});
  else{
    const over=Math.max(0,(t.Spending-b.Spending)/b.Spending);
    parts.push({key:"spending",label:"Spending control",weight:w.spending,
      score:clamp(1-over/zero,0,1)*100,counted:true,
      why: over>0 ? `${pct(over,0)} over budget.` : "Inside budget."});
  }
  goalPart("investment","Investing vs target","Investment");
  goalPart("protection","Protection vs target","Protection");
  const net=netCashFlow(list);
  if(t.Income<=0) parts.push({key:"cashflow",label:"Cash flow",weight:w.cashflow,score:null,
    counted:false,why:"No income recorded in this period."});
  else parts.push({key:"cashflow",label:"Cash flow",weight:w.cashflow,
    score:clamp(net/t.Income,0,0.35)/0.35*100,counted:true,
    why: net>=0 ? `Kept ${moneyPlain(net,0)} of income.` : "Outflows exceeded income."});

  const used=parts.filter(p=>p.counted);
  const wt=sum(used.map(p=>p.weight));
  const score = wt ? sum(used.map(p=>p.score*p.weight))/wt : null;
  const h=S.settings.health;
  let band={label:"Not enough data",tone:"info"};
  if(score!==null){
    band = score>=h.strong ? {label:"Strong",tone:"ok"}
         : score>=h.fair   ? {label:"Fair",tone:"warn"}
                           : {label:"Needs work",tone:"bad"};
  }
  return {score, band, parts, counted:used.length, total:parts.length};
}

/* monthly series for a whole year — feeds every trend chart */
function monthlySeries(year){
  const rows=MONTHS.map((_,m)=>{
    const list=txInRange(new Date(year,m,1), new Date(year,m+1,0));
    const t=totalByPillar(list);
    return {m, label:MON[m], ...t,
      expenses:t.Spending+t.Expenditure,
      transfers:t.Savings+t.Investment+t.Protection,
      net:t.Income-t.Spending-t.Expenditure,
      count:list.length};
  });
  return rows;
}
function hasDataInYear(year){ return monthlySeries(year).some(r=>r.count>0); }

/* For trend lines: a month with no records at all is unknown, not zero.
   Plotting it as zero draws a cliff that the data does not support. */
function line(rows,key){ return rows.map(r=>r.count?r[key]:null); }
/* Running total that stops once the records run out. */
function cumulative(rows,key){
  let run=0, last=rows.reduce((a,r,i)=>r.count?i:a,-1);
  return rows.map((r,i)=>{ run+=r[key]; return i<=last?run:null; });
}

/* trend between this period and the one before it */
function trend(pillar){
  const cur=totalByPillar(periodTx())[pillar];
  const pp=prevPeriod(); const prev=totalByPillar(txInRange(pp.from,pp.to))[pillar];
  if(!prev) return null;
  return {change:cur-prev, pctChange:(cur-prev)/prev, prev, label:pp.label};
}

/* ---- insight engine: observations only, generated from real numbers ---- */
function insights(p=resolvePeriod()){
  const list=periodTx(p), t=totalByPillar(list), b=budgetFor(p), out=[];
  const el=periodElapsed(p);
  const add=(tone,title,detail,route)=>out.push({tone,title,detail,route});

  if(!list.length){
    add("info","No activity in this period","Nothing has been recorded for "+p.label+" yet.","transactions");
    return out;
  }
  const net=netCashFlow(list);
  if(net<0) add("bad","Negative cash flow",
    `Spending and expenditure exceed income by ${moneyPlain(Math.abs(net),0)} in this period.`,"reports");
  else add("ok","Positive cash flow",
    `Income covers all expenses with ${moneyPlain(net,0)} left over.`,"reports");

  if(b.Spending){
    const over=t.Spending-b.Spending;
    if(over>0) add("bad","Spending over budget",
      `Spending is ${moneyPlain(over,0)} above the ${moneyPlain(b.Spending,0)} budget.`,"spending");
    else if(p.isMonth && !el.past && el.frac>0.02){
      const used=t.Spending/b.Spending;
      if(used>el.frac+0.12) add("warn","Spending is running ahead of the month",
        `${pct(used,0)} of the budget is used with ${pct(el.frac,0)} of the month elapsed.`,"spending");
      else add("ok","Spending is inside budget",
        `${moneyPlain(b.Spending-t.Spending,0)} of the budget is still available.`,"spending");
    } else add("ok","Spending is inside budget",
      `${moneyPlain(b.Spending-t.Spending,0)} of the budget was unused.`,"spending");
  } else add("info","No spending budget set",
    "Set a spending budget to track utilisation and pace.","budget");

  const goalCheck=(pillar,route)=>{
    if(!b[pillar]) return;
    const r=t[pillar]/b[pillar];
    if(r>=1) add("ok",`${pillar} target met`,
      `${moneyPlain(t[pillar],0)} recorded against a ${moneyPlain(b[pillar],0)} target.`,route);
    else if(r>=0.8) add("warn",`${pillar} close to target`,
      `${pct(r,0)} of the target — ${moneyPlain(b[pillar]-t[pillar],0)} to go.`,route);
    else add("bad",`${pillar} behind target`,
      `Only ${pct(r,0)} of the ${moneyPlain(b[pillar],0)} target — short by ${moneyPlain(b[pillar]-t[pillar],0)}.`,route);
  };
  goalCheck("Savings","savings"); goalCheck("Investment","investments");
  goalCheck("Protection","protection"); goalCheck("Income","income");
  if(b.Expenditure){
    const over=t.Expenditure-b.Expenditure;
    if(over>0) add("bad","Expenditure over plan",
      `Major expenditure is ${moneyPlain(over,0)} above plan.`,"expenditure");
  }
  const un=unallocated(list);
  if(un<0) add("warn","Transfers exceed leftover cash",
    `Money moved to savings, investing and protection is ${moneyPlain(Math.abs(un),0)} more than what income covered after expenses.`,"budget");

  const top=byCategory(list,"Spending")[0];
  if(top && t.Spending) add("info","Largest spending category",
    `${top.name} accounts for ${pct(top.value/t.Spending,0)} of spending (${moneyPlain(top.value,0)}).`,"spending");

  const pending=list.filter(t2=>t2.pillar==="Expenditure"&&(t2.status==="Planned"||t2.status==="Upcoming"));
  if(pending.length) add("warn","Expenditure not yet paid",
    `${pending.length} item${pending.length>1?"s":""} totalling ${moneyPlain(sum(pending.map(x=>+x.amount||0)),0)} still to settle.`,"expenditure");

  const uncat=S.transactions.filter(t2=>!t2.category||!t2.pillar);
  if(uncat.length) add("warn","Transactions missing a category",
    `${uncat.length} record${uncat.length>1?"s":""} cannot be grouped until a pillar and category are set.`,"transactions");

  const order={bad:0,warn:1,ok:2,info:3};
  return out.sort((a,b2)=>order[a.tone]-order[b2.tone]);
}

/* ============================================================
   5. CHARTS — hand-built SVG so the file stays self-contained
   and offline. Every chart answers one financial question.
   ============================================================ */
let TIP;
function tipEl(){
  if(!TIP){ TIP=document.createElement("div"); TIP.className="tip"; TIP.style.display="none";
    document.body.appendChild(TIP); }
  return TIP;
}
function showTip(e,html){
  const t=tipEl(); t.innerHTML=html; t.style.display="block";
  const r=t.getBoundingClientRect();
  let x=e.clientX+14, y=e.clientY-10;
  if(x+r.width>innerWidth-10) x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-10) y=innerHeight-r.height-10;
  t.style.left=Math.max(8,x)+"px"; t.style.top=Math.max(8,y)+"px";
}
function hideTip(){ if(TIP) TIP.style.display="none"; }
document.addEventListener("scroll",hideTip,true);

function niceMax(v){
  if(v<=0) return 100;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p;
  const step = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return step*p;
}
function shortMoney(v){
  const a=Math.abs(v);
  if(a>=1e6) return "\u20B1"+(v/1e6).toFixed(a>=1e7?0:1)+"M";
  if(a>=1e3) return "\u20B1"+(v/1e3).toFixed(a>=1e4?0:1)+"k";
  return "\u20B1"+Math.round(v);
}
function attach(svg,sel,make){
  svg.querySelectorAll(sel).forEach(n=>{
    n.addEventListener("mousemove",e=>showTip(e,make(n)));
    n.addEventListener("mouseenter",e=>showTip(e,make(n)));
    n.addEventListener("mouseleave",hideTip);
    n.addEventListener("focus",e=>{
      const r=n.getBoundingClientRect();
      showTip({clientX:r.left+r.width/2,clientY:r.top},make(n));
    });
    n.addEventListener("blur",hideTip);
  });
}

/* ---- line chart: trends over months ---- */
function lineChart(host,{labels,series,height=210,money:isMoney=true}){
  const W=Math.max(host.clientWidth||620,320), H=height,
        P={t:14,r:12,b:26,l:52}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const all=series.flatMap(s=>s.values.filter(v=>v!==null));
  if(!all.length){ host.innerHTML=`<div class="empty-sm">Nothing to plot yet.</div>`; return; }
  let hi=Math.max(...all,0), lo=Math.min(...all,0);
  hi=niceMax(hi||1); if(lo<0) lo=-niceMax(-lo);
  const span=(hi-lo)||1;
  const x=i=>P.l+(labels.length<2?iw/2:i*iw/(labels.length-1));
  const y=v=>P.t+ih-((v-lo)/span)*ih;
  const ticks=5;
  let g="";
  for(let i=0;i<=ticks;i++){
    const v=lo+span*i/ticks, yy=y(v);
    g+=`<line class="grid-line" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/>`
      +`<text x="${P.l-8}" y="${yy+3.5}" text-anchor="end">${isMoney?shortMoney(v):Math.round(v)}</text>`;
  }
  if(lo<0) g+=`<line class="axis-line" x1="${P.l}" y1="${y(0)}" x2="${W-P.r}" y2="${y(0)}" stroke-width="1.4"/>`;
  labels.forEach((l,i)=>{ g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });

  let paths="", dots="";
  series.forEach(s=>{
    /* split into unbroken runs so a missing month reads as a gap, not a straight
       line drawn across data that does not exist */
    const runs=[]; let run=[];
    s.values.forEach((v,i)=>{
      if(v===null){ if(run.length) runs.push(run); run=[]; }
      else run.push([x(i),y(v)]);
    });
    if(run.length) runs.push(run);
    runs.forEach(pts=>{
      if(s.area && pts.length>1)
        paths+=`<polygon fill="${s.color}" opacity=".08" points="${pts.map(p=>p.join(",")).join(" ")} ${pts[pts.length-1][0]},${y(Math.max(0,lo))} ${pts[0][0]},${y(Math.max(0,lo))}"/>`;
      if(pts.length>1)
        paths+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"
          stroke-linecap="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
      pts.forEach(pt=>dots+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="3" fill="${s.color}"/>`);
    });
  });
  let hits="";
  labels.forEach((l,i)=>{
    const w=iw/Math.max(1,labels.length-1);
    hits+=`<rect class="hit" x="${x(i)-w/2}" y="${P.t}" width="${w}" height="${ih}" tabindex="0"
      data-i="${i}" role="img" aria-label="${esc(l)}"></rect>`;
  });
  host.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}"
    preserveAspectRatio="xMidYMid meet">${g}${paths}${dots}${hits}</svg>`;
  attach(host.querySelector("svg"),".hit",n=>{
    const i=+n.dataset.i;
    return `<div class="tip-t">${esc(labels[i])}</div>`+series.map(s=>
      `<div class="tip-r"><i>${esc(s.name)}</i><span>${s.values[i]===null?"\u2014":moneyPlain(s.values[i],0)}</span></div>`).join("");
  });
}

/* ---- grouped bar chart: budget against actual ---- */
function barChart(host,{labels,series,height=230,money:isMoney=true}){
  const W=Math.max(host.clientWidth||620,320), H=height,
        P={t:14,r:12,b:30,l:52}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const all=series.flatMap(s=>s.values);
  if(!all.length||all.every(v=>!v)){ host.innerHTML=`<div class="empty-sm">Nothing to plot yet.</div>`; return; }
  let hi=niceMax(Math.max(...all,0)||1), lo=Math.min(...all,0);
  if(lo<0) lo=-niceMax(-lo);
  const span=(hi-lo)||1;
  const y=v=>P.t+ih-((v-lo)/span)*ih;
  const gw=iw/labels.length, bw=Math.min(30,(gw*0.72)/series.length);
  let g="";
  for(let i=0;i<=4;i++){
    const v=lo+span*i/4, yy=y(v);
    g+=`<line class="grid-line" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/>`
      +`<text x="${P.l-8}" y="${yy+3.5}" text-anchor="end">${isMoney?shortMoney(v):Math.round(v)}</text>`;
  }
  g+=`<line class="axis-line" x1="${P.l}" y1="${y(0)}" x2="${W-P.r}" y2="${y(0)}"/>`;
  let bars="";
  labels.forEach((l,i)=>{
    const cx=P.l+gw*i+gw/2;
    const start=cx-(bw*series.length)/2;
    series.forEach((s,si)=>{
      const v=s.values[i]||0, yy=Math.min(y(v),y(0)), h=Math.abs(y(v)-y(0));
      const col=s.colors?s.colors[i]:s.color;
      bars+=`<rect class="bar hit-b" x="${start+si*bw}" y="${yy}" width="${bw-3}" height="${Math.max(h,v?1.5:0)}"
        rx="2" fill="${col}" ${s.faded?'opacity=".38"':''} tabindex="0" data-i="${i}" data-s="${si}"
        role="img" aria-label="${esc(l)} ${esc(s.name)} ${moneyPlain(v,0)}"></rect>`;
    });
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${esc(l)}</text>`;
  });
  host.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}"
    preserveAspectRatio="xMidYMid meet">${g}${bars}</svg>`;
  attach(host.querySelector("svg"),".hit-b",n=>{
    const i=+n.dataset.i;
    return `<div class="tip-t">${esc(labels[i])}</div>`+series.map(s=>
      `<div class="tip-r"><i>${esc(s.name)}</i><span>${moneyPlain(s.values[i]||0,0)}</span></div>`).join("");
  });
}

/* ---- horizontal bars: category rankings ---- */
function hBarChart(host,{rows,height,color,total}){
  if(!rows.length){ host.innerHTML=`<div class="empty-sm">Nothing to plot yet.</div>`; return; }
  const max=Math.max(...rows.map(r=>r.value))||1;
  const T=total||sum(rows.map(r=>r.value));
  host.innerHTML=rows.map(r=>{
    const w=clamp(r.value/max,0,1)*100;
    return `<div style="margin:9px 0">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:4px">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
        <span style="color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap">
          ${moneyPlain(r.value,0)}${T?` <span style="color:var(--text-3)">\u00B7 ${pct(r.value/T,0)}</span>`:""}</span>
      </div>
      <div class="meter" style="--m:${r.color||color||"var(--neutral)"}"><i style="width:${w}%"></i></div>
    </div>`;
  }).join("");
}

/* ---- donut: composition ---- */
function donutChart(host,{slices,size=200,center,centerSub}){
  const live=slices.filter(s=>s.value>0);
  if(!live.length){ host.innerHTML=`<div class="empty-sm">Nothing to plot yet.</div>`; return; }
  const total=sum(live.map(s=>s.value));
  const R=size/2, r=R*0.6, cx=R, cy=R;
  let a=-Math.PI/2, paths="";
  live.forEach((s,i)=>{
    const frac=s.value/total, a2=a+frac*Math.PI*2;
    const big=frac>0.5?1:0;
    const p=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
    const [x1,y1]=p(R,a), [x2,y2]=p(R,a2), [x3,y3]=p(r,a2), [x4,y4]=p(r,a);
    const d = live.length===1
      ? `M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} L ${cx-0.01} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z`
      : `M ${x1} ${y1} A ${R} ${R} 0 ${big} 1 ${x2} ${y2} L ${x3} ${y3} A ${r} ${r} 0 ${big} 0 ${x4} ${y4} Z`;
    paths+=`<path class="hit-d" d="${d}" fill="${s.color}" tabindex="0" data-i="${i}"
      role="img" aria-label="${esc(s.name)} ${moneyPlain(s.value,0)} ${pct(frac,0)}"></path>`;
    a=a2;
  });
  const mid=center!==undefined?center:shortMoney(total);
  host.innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center">
    <div style="position:relative;width:${size}px;height:${size}px;flex:0 0 auto">
      <svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>
      <div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none">
        <div class="amt" style="font-size:19px">${esc(mid)}</div>
        <div style="font-size:10.5px;color:var(--text-3);font-family:var(--f-d);letter-spacing:.09em;
          text-transform:uppercase;margin-top:2px">${esc(centerSub||"Total")}</div>
      </div>
    </div>
    <div style="flex:1;min-width:150px">${live.map(s=>
      `<div style="display:flex;align-items:center;gap:8px;padding:3.5px 0;font-size:12.5px">
        <span class="swatch" style="background:${s.color};margin:0"></span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span>
        <span style="color:var(--text-2);font-variant-numeric:tabular-nums">${pct(s.value/total,0)}</span>
      </div>`).join("")}</div>
  </div>`;
  attach(host.querySelector("svg"),".hit-d",n=>{
    const s=live[+n.dataset.i];
    return `<div class="tip-t">${esc(s.name)}</div>
      <div class="tip-r"><i>Amount</i><span>${moneyPlain(s.value,0)}</span></div>
      <div class="tip-r"><i>Share</i><span>${pct(s.value/total,1)}</span></div>`;
  });
}

/* ---- the signature: allocation ribbon ---- */
function allocationRibbon(host,list){
  const t=totalByPillar(list), income=t.Income;
  if(!income){
    host.innerHTML=`<div class="ribbon-empty">Record income for this period to see how it was allocated</div>`;
    return;
  }
  const un=Math.max(0,unallocated(list));
  const over=unallocated(list)<0;
  const parts=[
    {name:"Spending",value:t.Spending}, {name:"Expenditure",value:t.Expenditure},
    {name:"Savings",value:t.Savings}, {name:"Investment",value:t.Investment},
    {name:"Protection",value:t.Protection}, {name:"Unallocated",value:un}
  ].filter(p=>p.value>0);
  const denom=Math.max(income,sum(parts.map(p=>p.value)));
  host.innerHTML=`
    <div class="ribbon" role="img" aria-label="Allocation of ${moneyPlain(income,0)} income">
      ${parts.map(p=>{
        const f=p.value/denom;
        return `<span class="hit-r ${f<0.07?"tiny":""}" style="flex:${p.value} 1 0;background:${HUE[p.name]}"
          data-n="${esc(p.name)}" data-v="${p.value}" data-f="${f}" tabindex="0">${pct(f,0)}</span>`;
      }).join("")}
    </div>
    <div class="ribbon-legend">
      ${parts.map(p=>`<span class="rl"><span class="swatch" style="background:${HUE[p.name]}"></span>
        ${esc(p.name)} <b>${moneyPlain(p.value,0)}</b>
        <span class="muted">${pct(p.value/denom,0)}</span></span>`).join("")}
    </div>
    <div class="per100">For every <b>\u20B1100</b> earned this period:
      ${parts.map(p=>`<b>\u20B1${(p.value/income*100).toFixed(0)}</b> ${p.name.toLowerCase()}`).join(" \u00B7 ")}.
      ${over?`<span style="color:var(--bad)"> Transfers went beyond what income covered after expenses.</span>`:""}
    </div>`;
  attach(host,".hit-r",n=>`<div class="tip-t">${esc(n.dataset.n)}</div>
    <div class="tip-r"><i>Amount</i><span>${moneyPlain(+n.dataset.v,0)}</span></div>
    <div class="tip-r"><i>Of income</i><span>${pct(+n.dataset.v/income,1)}</span></div>`);
}

    <div class="split" style="margin:14px 0">

function mountDash(ribbon,donut,flow,list,p){
  onMount(()=>{
    allocationRibbon($("#"+ribbon),list);
    const cats=byCategory(list,"Spending").slice(0,8);
    const shades=["#AE382F","#C0564C","#CE6F65","#D9887F","#E2A099","#EAB7B2","#F0CCC8","#C99A93"];
    donutChart($("#"+donut),{slices:cats.map((c,i)=>({name:c.name,value:c.value,color:shades[i%shades.length]})),
      centerSub:"Spending"});
    const rows=monthlySeries(p.y||CUR_Y);
    lineChart($("#"+flow),{labels:rows.map(r=>r.label),series:[
      {name:"Income",values:line(rows,"Income"),color:HUE.Income,area:true},
      {name:"Expenses",values:line(rows,"expenses"),color:HUE.Spending},
      {name:"Net cash flow",values:line(rows,"net"),color:"var(--brass)"}]});
  });
  return `<div class="legend" style="margin-top:10px">
    <span><span class="swatch" style="background:${HUE.Income}"></span>Income</span>
    <span><span class="swatch" style="background:${HUE.Spending}"></span>Expenses (spending + expenditure)</span>
    <span><span class="swatch" style="background:var(--brass)"></span>Net cash flow</span></div>`;
}
function paceCard(p,t,b,el){
  if(!p.isMonth) return "";
  return card("Budget pace",`
    <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">
      ${["Spending","Expenditure"].map(k=>{
        const used=ratio(t[k],b[k]);
        if(!b[k]) return `<div><div class="kpi-label" style="margin-bottom:7px">${k} budget</div>
          <div class="empty-sm" style="padding:10px 0;text-align:left">No budget set.
          <button class="att-link" data-nav="budget">Set one \u2192</button></div></div>`;
        const ahead=used>el.frac+0.1;
        return `<div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px">
            <span class="kpi-label">${k} budget</span>
            ${badge(used>1?"bad":ahead?"warn":"ok",used>1?"Over budget":ahead?"Ahead of pace":"On pace")}
          </div>
          <div class="pace">
            <span class="pace-flag" style="left:${clamp(el.frac,0.08,0.92)*100}%">Day ${el.day} of ${el.total}</span>
            ${meter(used,HUE[k])}
          </div>
          <div class="kpi-row" style="margin-top:8px"><span>${pct(used,0)} of budget used</span>
            <b>${pct(el.frac,0)} elapsed</b></div>
        </div>`;
      }).join("")}
    </div>`,{note:"Is spending moving faster than the month?"});
}
function budgetTable(t,b){
  if(!hasBudget(b)) return `<div class="empty-sm">No targets set for this period.
    <button class="att-link" data-nav="budget">Set targets \u2192</button></div>`;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Pillar</th><th class="r">Target</th><th class="r">Actual</th>
      <th class="r">Variance</th><th class="r">Progress</th><th>Status</th></tr></thead>
    <tbody>${PILLARS.map(pl=>{
      const v=variance(pl,t[pl],b[pl]), st=budgetStatus(pl,t[pl],b[pl]);
      const frac=ratio(t[pl],b[pl]);
      return `<tr>
        <td><span class="swatch" style="background:${HUE[pl]}"></span>${pl}</td>
        <td class="r">${b[pl]?moneyPlain(b[pl],0):"\u2014"}</td>
        <td class="r strong">${moneyPlain(t[pl],0)}</td>
        <td class="r" style="color:${v===null?"inherit":v>=0?"var(--ok)":"var(--bad)"}">
          ${v===null?"\u2014":(v>=0?"+":"\u2212")+moneyPlain(Math.abs(v),0).replace("\u2212","")}</td>
        <td class="r" style="min-width:110px">${b[pl]?`${meter(frac,HUE[pl],true)}
          <span style="font-size:11px;color:var(--text-3)">${pct(frac,0)}</span>`:"\u2014"}</td>
        <td>${badge(st.tone,st.label)}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}
function healthBlock(h){
  if(h.score===null) return `<div class="empty-sm">Set targets on the Budget page to calculate a score.
    <button class="att-link" data-nav="budget">Set targets \u2192</button></div>`;
  return `<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:4px">
      <div class="amt" style="font-size:38px">${h.score.toFixed(0)}<span
        style="font-size:15px;color:var(--text-3);font-weight:500"> / 100</span></div>
      ${badge(h.band.tone,h.band.label)}</div>
    <p class="card-note" style="margin:0 0 12px">Measures how closely this period matched the targets you set
      \u2014 nothing more. ${h.counted} of ${h.total} components could be scored.</p>
    ${h.parts.map(p=>`<div style="margin:9px 0">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:4px">
        <span>${esc(p.label)} <span style="color:var(--text-3)">\u00B7 weight ${p.weight}</span></span>
        <span style="font-variant-numeric:tabular-nums;color:var(--text-2)">
          ${p.counted?p.score.toFixed(0):"Not scored"}</span></div>
      ${p.counted?meter(p.score/100,p.score>=80?"var(--ok)":p.score>=60?"var(--warn)":"var(--bad)",true)
        :`<div class="meter thin"><i style="width:0"></i></div>`}
      <div style="font-size:11px;color:var(--text-3);margin-top:3px">${esc(p.why)}</div></div>`).join("")}
    <div style="margin-top:12px"><button class="btn btn-sm" data-nav="settings">Adjust weights</button></div>`;
}

/* ---------------------------------------------------------- BUDGET */
PAGES.budget=()=>{
  const p=resolvePeriod();
  const y=p.y||CUR_Y, m=p.isMonth?p.m:CUR_M, key=mKey(y,m);
  const b={...blankBudget(),...(S.budgets[key]||{})};
  const list=txInRange(new Date(y,m,1),new Date(y,m+1,0)), t=totalByPillar(list);
  const planned=b.Savings+b.Spending+b.Expenditure+b.Investment+b.Protection;
  const left=b.Income-planned;
  const state = !b.Income ? {tone:"info",label:"No income target yet"}
    : left<0 ? {tone:"bad",label:"Over-allocated"}
    : left>0 ? {tone:"warn",label:"Under-allocated"} : {tone:"ok",label:"Balanced"};
  const el=periodElapsed({from:new Date(y,m,1),to:new Date(y,m+1,0)});

  return `<div class="page">
    ${pageHead("Monthly Budget Planner",`Set the plan for ${MONTHS[m]} ${y}. Everything else reads from it.`)}
    ${!p.isMonth?`<div class="notice" style="margin-bottom:14px">The period selector is on a multi-month view.
      Targets are set one month at a time, so this page is editing <b>${MONTHS[m]} ${y}</b>.</div>`:""}

    <div class="split" style="margin-bottom:14px">
      ${card(`Targets for ${MONTHS[m]} ${y}`,`
        <div class="tbl-wrap"><table class="tbl"><thead><tr>
          <th>Pillar</th><th class="r">Target</th><th class="r">Actual so far</th>
          <th class="r">Difference</th><th>Status</th></tr></thead><tbody>
          ${PILLARS.map(pl=>{
            const st=budgetStatus(pl,t[pl],b[pl]);
            const v=variance(pl,t[pl],b[pl]);
            return `<tr>
              <td><span class="swatch" style="background:${HUE[pl]}"></span>${pl}
                <div style="font-size:11px;color:var(--text-3);margin-left:16px">
                  ${FLOW[pl]==="inflow"?"Money in":FLOW[pl]==="expense"?"True expense":"Moved to your own goals"}</div></td>
              <td class="r"><input type="number" min="0" step="100" class="bcell" data-budget="${pl}"
                data-key="${key}" value="${b[pl]||""}" placeholder="0" aria-label="${pl} target"
                style="width:118px;text-align:right;padding:5px 8px;border:1px solid var(--line-2);
                border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums"></td>
              <td class="r strong">${moneyPlain(t[pl],0)}</td>
              <td class="r" style="color:${v===null?"inherit":v>=0?"var(--ok)":"var(--bad)"}">
                ${v===null?"\u2014":(v>=0?"+":"\u2212")+moneyPlain(Math.abs(v),0).replace("\u2212","")}</td>
              <td>${badge(st.tone,st.label)}</td></tr>`;
          }).join("")}
          <tr class="total"><td>Allocated (all except income)</td>
            <td class="r">${moneyPlain(planned,0)}</td>
            <td class="r">${moneyPlain(t.Savings+t.Spending+t.Expenditure+t.Investment+t.Protection,0)}</td>
            <td class="r"></td><td></td></tr>
        </tbody></table></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-sm" data-act="copy-budget" data-key="${key}">Copy to every later month</button>
          <button class="btn btn-sm" data-act="budget-from-actual" data-key="${key}">Fill from this month's actuals</button>
          <button class="btn btn-sm btn-danger" data-act="clear-budget" data-key="${key}">Clear month</button>
        </div>`,{note:"Blue fields are yours to edit"})}

      <div style="display:grid;gap:14px;align-content:start">
        ${card("Does the plan balance?",`
          <div class="stat-row"><span>Planned income</span><b>${moneyPlain(b.Income,0)}</b></div>
          <div class="stat-row"><span>Planned allocation</span><b>${moneyPlain(planned,0)}</b></div>
          <div class="stat-row"><span>${left<0?"Over-allocated by":"Unallocated"}</span>
            <b style="color:${left<0?"var(--bad)":left>0?"var(--warn)":"var(--ok)"}">${moneyPlain(Math.abs(left),0)}</b></div>
          <div style="margin-top:12px">${badge(state.tone,state.label)}</div>
          <p class="card-note" style="margin-top:10px">
            ${left<0?"The plan commits more than the income target. Lower a target or raise planned income."
              :left>0?"Some planned income has no job yet. Give it one, or leave it as a deliberate buffer."
              :"Every peso of planned income has a destination."}</p>`)}
        ${card(`${MONTHS[m]} progress`,`
          <div class="pace" style="margin-bottom:10px">
            <span class="pace-flag" style="left:${clamp(el.frac,0.06,0.94)*100}%">Day ${el.day} of ${el.total}</span>
            ${meter(el.frac,"var(--rail-3)")}</div>
          <div class="stat-row"><span>Month elapsed</span><b>${pct(el.frac,1)}</b></div>
          <div class="stat-row"><span>Spending budget used</span>
            <b>${b.Spending?pct(t.Spending/b.Spending,1):"\u2014"}</b></div>
          <p class="card-note" style="margin-top:10px">If the budget is being used faster than the month is
            passing, the pace will not hold to the end of the month.</p>`)}
      </div>
    </div>

    ${card("The whole year at a glance",yearBudgetTable(y),
      {note:"Targets you have set, month by month"})}
  </div>`;
};
function yearBudgetTable(y){
  const any=MONTHS.some((_,m)=>S.budgets[mKey(y,m)]);
  if(!any) return `<div class="empty-sm">No targets set for ${y} yet. Fill in the table above, then copy it forward.</div>`;
  return `<div class="tbl-wrap"><table class="tbl" style="min-width:900px">
    <thead><tr><th>Pillar</th>${MON.map(l=>`<th class="r">${l}</th>`).join("")}<th class="r">Year</th></tr></thead>
    <tbody>${PILLARS.map(pl=>{
      const vals=MONTHS.map((_,m)=>+((S.budgets[mKey(y,m)]||{})[pl])||0);
      return `<tr><td><span class="swatch" style="background:${HUE[pl]}"></span>${pl}</td>
        ${vals.map(v=>`<td class="r">${v?v.toLocaleString("en-PH"):'<span style="color:var(--text-3)">\u2014</span>'}</td>`).join("")}
        <td class="r strong">${sum(vals).toLocaleString("en-PH")}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

/* ---------------------------------------------------------- TRANSACTIONS */
let TXF={pillar:"",category:"",account:"",method:"",status:"",sort:"date-desc"};
PAGES.transactions=()=>{
  const p=resolvePeriod();
  let rows=S.transactions.filter(t=>{
    const d=effDate(t); if(!d||d<p.from||d>p.to) return false;
    if(TXF.pillar&&t.pillar!==TXF.pillar) return false;
    if(TXF.category&&t.category!==TXF.category) return false;
    if(TXF.account&&t.account!==TXF.account) return false;
    if(TXF.method&&t.method!==TXF.method) return false;
    if(TXF.status&&t.status!==TXF.status) return false;
    if(SEARCH){
      const q=SEARCH.toLowerCase();
      const hay=[t.description,t.category,t.subcategory,t.pillar,t.account,t.method,t.notes]
        .filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const [f,dir]=TXF.sort.split("-");
  rows.sort((a,b)=>{
    let r = f==="amount" ? (+a.amount||0)-(+b.amount||0)
          : f==="category" ? String(a.category).localeCompare(String(b.category))
          : String(a.date).localeCompare(String(b.date));
    return dir==="desc"?-r:r;
  });
  const t=totalByPillar(rows);

  const opt=(v,cur)=>`<option value="${esc(v)}"${cur===v?" selected":""}>${esc(v)}</option>`;
  const tools=`<div class="tools">
    <select data-f="pillar" aria-label="Filter by pillar"><option value="">All pillars</option>
      ${PILLARS.map(x=>opt(x,TXF.pillar)).join("")}</select>
    <select data-f="category" aria-label="Filter by category"><option value="">All categories</option>
      ${(TXF.pillar?S.settings.categories[TXF.pillar]:Object.values(S.settings.categories).flat())
        .map(x=>opt(x,TXF.category)).join("")}</select>
    <select data-f="account" aria-label="Filter by account"><option value="">All accounts</option>
      ${S.settings.accounts.map(x=>opt(x,TXF.account)).join("")}</select>
    <select data-f="method" aria-label="Filter by payment method"><option value="">All payment methods</option>
      ${S.settings.methods.map(x=>opt(x,TXF.method)).join("")}</select>
    <select data-f="status" aria-label="Filter by status"><option value="">Any status</option>
      ${STATUSES.map(x=>opt(x,TXF.status)).join("")}</select>
    <select data-f="sort" aria-label="Sort">
      <option value="date-desc"${TXF.sort==="date-desc"?" selected":""}>Newest first</option>
      <option value="date-asc"${TXF.sort==="date-asc"?" selected":""}>Oldest first</option>
      <option value="amount-desc"${TXF.sort==="amount-desc"?" selected":""}>Largest amount</option>
      <option value="amount-asc"${TXF.sort==="amount-asc"?" selected":""}>Smallest amount</option>
      <option value="category-asc"${TXF.sort==="category-asc"?" selected":""}>Category A\u2013Z</option>
    </select>
    ${(TXF.pillar||TXF.category||TXF.account||TXF.method||TXF.status||SEARCH)
      ?`<button class="btn btn-sm btn-ghost" data-act="clear-filters">Clear filters</button>`:""}
    <span style="margin-left:auto;font-size:12.5px;color:var(--text-2)">
      ${rows.length} record${rows.length===1?"":"s"} \u00B7 ${moneyPlain(sum(rows.map(r=>+r.amount||0)),0)}</span>
  </div>`;

  if(!S.transactions.length){
    return `<div class="page">${pageHead("Transactions","Every peso you record starts here.")}
      ${card("",emptyState({
        title:"No transactions yet",
        body:"This is the operational heart of the system \u2014 every total, chart and alert in the app is calculated from these records.",
        list:["Pick the pillar first: it decides whether the money left you or simply moved",
              "Spending and Expenditure are true expenses",
              "Savings, Investment and Protection are transfers to your own goals",
              "Nothing is counted twice"],
        action:addBtn()}))}</div>`;
  }

  return `<div class="page">
    ${pageHead("Transactions",`${p.label} \u00B7 every record in this period.`)}
    ${card("",`${tools}
      ${rows.length?`<div class="tbl-wrap"><table class="tbl" style="min-width:820px">
        <thead><tr><th>Date</th><th>Pillar</th><th>Category</th><th>Description</th>
          <th>Account</th><th>Method</th><th class="r">Amount</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td style="white-space:nowrap">${fmtDate(r.date)}
            ${isShifted(r)?`<span class="pill" style="background:var(--expend-s);color:var(--warn);margin-left:4px"
              title="Late-income rule moved this into the next month">next month</span>`:""}</td>
          <td><span class="swatch" style="background:${HUE[r.pillar]||"var(--neutral)"}"></span>${esc(r.pillar||"\u2014")}</td>
          <td>${esc(r.category||"\u2014")}${r.subcategory?`<div style="font-size:11px;color:var(--text-3)">${esc(r.subcategory)}</div>`:""}</td>
          <td>${esc(r.description||"\u2014")}</td>
          <td style="color:var(--text-2)">${esc(r.account||"\u2014")}</td>
          <td style="color:var(--text-2)">${esc(r.method||"\u2014")}</td>
          <td class="r strong">${moneyPlain(+r.amount||0,2)}</td>
          <td>${r.status?`<span class="pill" style="background:var(--neutral-s);color:var(--text-2)">${esc(r.status)}</span>`:""}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-sm btn-ghost" data-act="edit-tx" data-id="${r.id}">Edit</button>
            <button class="btn btn-sm btn-ghost" data-act="del-tx" data-id="${r.id}"
              aria-label="Delete transaction">\u00D7</button></td>
        </tr>`).join("")}</tbody>
        <tfoot><tr class="total"><td colspan="6">Period total by pillar</td>
          <td class="r">${moneyPlain(sum(rows.map(r=>+r.amount||0)),0)}</td><td colspan="2"></td></tr></tfoot>
      </table></div>
      <div class="legend" style="margin-top:12px">${PILLARS.map(pl=>
        `<span><span class="swatch" style="background:${HUE[pl]}"></span>${pl} ${moneyPlain(t[pl],0)}</span>`).join("")}</div>`
      :`<div class="empty-sm">No records match these filters.
        <button class="att-link" data-act="clear-filters">Clear filters</button></div>`}`,
      {right:addBtn()})}
  </div>`;
};

/* ---------------------------------------------------------- shared pillar shell */
function pillarEmpty(pillar,body,list){
  return card("",emptyState({title:`No ${pillar.toLowerCase()} recorded yet`,body,list,action:addBtn()}));
}
function catTable(list,pillar,total){
  const rows=byCategory(list,pillar);
  if(!rows.length) return `<div class="empty-sm">Nothing recorded in this period.</div>`;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Category</th><th class="r">Amount</th><th class="r">Share</th>
      <th class="r">Records</th><th class="r" style="width:130px">Weight</th></tr></thead>
    <tbody>${rows.map(r=>{
      const n=list.filter(t=>t.pillar===pillar&&t.category===r.name).length;
      return `<tr><td><span class="swatch" style="background:${HUE[pillar]}"></span>${esc(r.name)}</td>
        <td class="r strong">${moneyPlain(r.value,0)}</td>
        <td class="r">${pct(ratio(r.value,total)||0,1)}</td>
        <td class="r" style="color:var(--text-2)">${n}</td>
        <td class="r">${meter(ratio(r.value,rows[0].value),HUE[pillar],true)}</td></tr>`;
    }).join("")}
    <tr class="total"><td>Total</td><td class="r">${moneyPlain(total,0)}</td>
      <td class="r">100%</td><td class="r"></td><td></td></tr></tbody></table></div>`;
}

              {k:"Records",v:list.filter(x=>x.pillar==="Income").length}]})}
      ${kpi({pillar:"Income",label:"Achievement",value:null,

        rows:[{k:"Recorded in",v:y}]})}
